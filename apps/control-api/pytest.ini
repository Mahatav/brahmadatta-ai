[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = contracts/tests api/tests missions/tests orchestrator/tests authorization/tests
addopts = -q
asyncio_mode = auto
filterwarnings =
    error::DeprecationWarning:contracts.*
    error::DeprecationWarning:api.*
markers =
    slow: exercises real cmake/ctest subprocesses (seconds, not milliseconds) - #168 T1's orchestrator/tests/test_baseline_executor.py, mirroring workers/baseline's own marker (root pytest.ini).
