# mypy — static type checking for all Python in the repository.
#
# A standalone mypy.ini rather than a [tool.mypy] table, for the same reason as ruff.toml:
# it must not collide with a pyproject.toml the backend developer may add.
#
# Strictness is set at "catches real mistakes, does not block the build". `strict = true`
# on a codebase that is one day old and includes Django — whose dynamic attributes need
# django-stubs to type at all — would produce a red baseline that the next person learns
# to ignore. That is worse than a moderate setting everyone keeps green. Ratchet it up
# once django-stubs is in requirements; noted as an open question in the D1 handoff.

[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Off for now, on later: these two are what make mypy genuinely strict, and turning them
# on before django-stubs exists just produces noise about Django's own surface.
disallow_untyped_defs = False
disallow_any_generics = False

# Third-party packages that ship no type information yet.
ignore_missing_imports = True

exclude = (?x)(
    ^\.venv/
    | /\.venv/
    | ^demo/repositories/
    | /migrations/
  )
