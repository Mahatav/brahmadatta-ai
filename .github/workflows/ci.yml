# Brahmadatta AI — continuous integration.
#
# The CTO originally cut D1's CI scope to `pytest` and an OpenAPI dump
# freshness check, on the grounds that a lint matrix, a type-check matrix and a coverage
# gate are cost with no gate behind them in a seven-day build. The configuration for all
# of those still exists and is still run locally — see
# docs/04-development/31-development-setup-guide.md §Checks — it is just not spending
# runner minutes on every pull request this week.
#
# Three of those four scripts are now BACK IN, in the `ingress` job. The argument that put
# them there is not "more checks are better", it is that each one guards a property that
# fails SILENTLY — nothing goes red, nothing logs an error, and the first symptom is at the
# finale. A lint failure announces itself; a buffered event stream does not.
#
#   nginx -t + compose config       ingress job. ~30s. Catches a config that cannot start.
#   SSE survives the proxy          ingress job. ~2min. Two of its four cases inject a
#                                   violation and require the stream to break (#114).
#   only nginx has egress (C4)      ingress job, plus the static half in
#                                   tests/architecture/test_compose_topology.py, which runs
#                                   in the cheap pytest job and needs nothing running.
#
# What is still NOT in CI, and how it is covered instead:
#
#   ruff / mypy                     ruff.toml, mypy.ini — run locally
#   shellcheck, actionlint          run locally
#   finale-egress-evidence.sh       REHEARSAL, not CI. It builds and boots the whole finale
#                                   stack to prove egress denial from inside the running
#                                   container. That is the right test and the wrong cadence
#                                   — see SEC-R3 and docs/06-operations/74-rehearsal-checklist.md,
#                                   where it is a numbered checklist item with a place to
#                                   record the output, not an intention.
#
# Design notes that survive the cut:
#   - Actions are pinned to a commit SHA, not a tag. A tag is mutable and can be repointed
#     at new code without any change on our side. Same rule as the image digest pins in
#     infrastructure/compose/.
#   - permissions is read-only. No job writes to the repository.
#   - No secret is used by any job. Nothing here talks to a paid service, a model provider,
#     or any external inference API.
#   - Steps that depend on a directory which does not exist yet skip cleanly and say so, so
#     an unrelated pull request does not go red while the tree is still filling in.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  frontend:
    name: command center
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/command-center/package-lock.json

      - name: Install frontend tooling
        run: npm ci

      - name: Install Command Center
        run: npm ci --prefix apps/command-center

      - name: Validate generated API types
        run: npm run check:api --prefix apps/command-center

      - name: Typecheck and build the static application
        run: npm run build --prefix apps/command-center

      - name: Lint frontend sources
        run: npm run lint

  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-24.04

    # BUG-022 (docs/09-company/11-qa-report.md, round 3, "major", devops + backend-developer):
    # there was no `services:` block here at all, so the whole control API suite ran on
    # SQLite. That does not merely fail to prove the lock-dependent properties — it HIDES
    # their failure, and QA measured exactly how much by how, running the SAME shipped code
    # against both engines:
    #
    #   TC-P0  is FOR UPDATE a lock at all?  Postgres: a second connection is REFUSED with
    #          "could not obtain lock on row". SQLite: the second connection ACQUIRES it
    #          immediately — the lock call compiles away to a no-op.
    #   TC-P1  gap-free `sequence` under 8 concurrent writers x 25 events: 200/200 rows,
    #          gap-free, on Postgres with the lock. The negative control (lock replaced by
    #          a plain `.get()`, i.e. what an "innocent" refactor produces) LOSES 147 of
    #          200 writes on Postgres — the unique constraint is a backstop, not a
    #          substitute for the lock.
    #   TC-P2  the candidate-set freeze (D-046) under an interleaved insert: 25/25 clean
    #          under the lock, 25/25 BREACHED without it — same code, same negative-control
    #          method.
    #   TC-P2b the same script, same shipped code, against SQLITE: the shipped D-046
    #          enforcement breaches 6 / 6. Not merely untested there — absent. "231 passed"
    #          on the SQLite suite is true and describes none of this.
    #
    # QA's own words: "this is not a defect in the code; it is the measurement of exactly
    # how much the CI signal is worth on this property, and it is the argument for BUG-022."
    #
    # The judgement call was whether to SPLIT — most tests on SQLite for speed, the
    # lock-dependent ones on Postgres — or to run everything on Postgres. Split, rejected:
    # every mechanism for assigning a test to the Postgres lane (a marker, a directory, a
    # naming convention) is something a person has to remember, and a lock-dependent test
    # that lands in the SQLite lane reports green while testing nothing — which is the exact
    # failure mode TC-P2b just measured. There is no assignment to get wrong if there is one
    # lane. QA's own concurrency harnesses (TC-P0/P1/P2) are throwaway scripts, not
    # committed, and reproducing them as a permanent CI check is out of this scope — tracked
    # as a follow-up, not silently dropped. This PR closes the SQLite-hides-it half of
    # BUG-022 (a regression in the compose/finale posture, i.e. an accidental switch back to
    # SQLite, now fails CI); it does not add the concurrency harnesses themselves.
    #
    # Cost: the service container adds roughly 10-15s, started in parallel with checkout;
    # QA measured the suite itself at 3.6x wall-clock on Postgres vs SQLite (4.87s vs
    # 1.29s) — round trips, not meaningfully slower in absolute terms. SQLite stays the
    # local default via apps/control-api/config/settings/test.py's `setdefault`, so a
    # developer with no Postgres running is unaffected; CI overrides it by exporting
    # DATABASE_URL below. Final approval authority: CTO (technical) — recorded as a decision
    # in this PR per BUG-022's routing ("engineering-manager to route").
    #
    # 16-alpine matches what QA measured against (postgres:16-alpine / PostgreSQL 16.13)
    # and what docker-compose.finale.yml runs.
    services:
      postgres:
        # postgres:16-alpine, pinned by multi-arch index digest, resolved and pull-tested
        # in this session. Same rule as every other image pin in this repository: a tag is
        # mutable and can be repointed under us between a green run and the next one.
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Folded in as a step rather than a third job: it takes two seconds, needs no setup,
      # and "no credential is ever committed" is not the kind of rule to leave to review
      # attention across a twelve-hour handoff.
      - name: No environment file, key, or certificate is tracked
        run: |
          set -euo pipefail
          bad="$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa|id_ed25519' \
            | grep -v -E '\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::tracked files that must never be committed:"
            echo "$bad"
            exit 1
          fi
          if git grep -I -n -E -- "-----BEGIN [A-Z ]*PRI""VATE KEY-----" -- . ; then
            echo "::error::private key material found in a tracked file"
            exit 1
          fi
          echo "ok: no tracked .env, private key, or certificate"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # BUG-016: this step used to run BEFORE control-api's dependencies existed, so the
      # import-direction check (C5) and the ingress-contract check could not import Django
      # and skipped silently — green, every run, testing nothing. Installing first turns
      # them back into real assertions.
      - name: Install control API dependencies
        run: |
          if [ -d apps/control-api ]; then
            pip install -r apps/control-api/requirements.txt
          else
            echo "apps/control-api does not exist yet — nothing to install"
          fi

      # Architecture invariants that hold regardless of what the application looks like:
      # the ASGI process must not import the gateway (C5), the Django half of the ingress
      # contract is set, and no container but nginx sits on a routable network.
      # No DJANGO_SETTINGS_MODULE here on purpose. Setting it makes pytest-django try to
      # bootstrap a Django project from the repository root, where there is no manage.py,
      # and the whole step dies on an ImportError before a single test runs. The tests that
      # need Django put apps/control-api on sys.path themselves.
      # `-rs` prints the reason for any skip, so a test that quietly stops asserting is
      # visible in the log rather than passing as a dot.
      - name: Architecture tests
        run: pytest tests/ -q -rs

      # The fixture and sandbox suites live outside `tests/` and outside apps/control-api,
      # so neither existing step collected them — they passed locally and did not exist as
      # far as CI was concerned. That made #71's central promise ("a contract change breaks
      # the fixture loudly") true on a laptop and false on the branch that matters.
      # Same shape as the bypass table gating only one of its two columns: a check nobody
      # can fail is a document.
      #
      # This references packages/sandbox/, not services/sandbox/. An earlier version of
      # this step (landed directly on this branch while the D-053 move was in flight)
      # still pointed at services/sandbox/ — the exact stale-path failure mode BUG-016
      # above already burned this project on once.
      #
      # SEC-34 (cybersecurity review of #113, Medium): an earlier version of this guard
      # printed a warning and then `exit 0`d when a directory was missing — a check
      # nobody can fail, the exact shape the CTO's own comment above this step warns
      # about, reproduced in the guard meant to prevent it. Fixed to fail the job.
      # `apps/control-api`'s existence check below is not the same situation and is not
      # touched by this: at D1 that directory legitimately did not exist yet, and
      # skipping cleanly during that bootstrap phase was correct. packages/sandbox and
      # packages/test-fixtures are added complete in this PR — there is no "not built
      # yet" phase for them from here on, so their absence in any future run can only
      # mean a regression, and reports as one.
      - name: Fixture and sandbox tests
        run: |
          set -euo pipefail
          missing=0
          for dir in packages/sandbox packages/test-fixtures; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir does not exist. Unlike apps/control-api at D1, this directory is not still being built — it shipped complete in PR #113. Its absence means something moved or deleted it without updating this workflow."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          pytest packages/sandbox/tests packages/test-fixtures/tests -q -rs

      - name: Control API tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DJANGO_DEBUG: "false"
          # See BUG-022 above `services:` for why this is Postgres, not sqlite:///ci.sqlite3.
          DATABASE_URL: "postgresql://ci:ci-only-not-a-real-password@127.0.0.1:5432/ci"
        run: |
          set -euo pipefail
          if [ ! -d apps/control-api ]; then
            echo "apps/control-api does not exist yet — skipping"
            exit 0
          fi
          pip install -r apps/control-api/requirements.txt

          # Drop any test_* database left on the service BEFORE running, so "a test_*
          # database exists afterward" is evidence about THIS run and not a stale leftover.
          # GitHub-hosted runners give every job a fresh service container, so this never
          # fires there — it matters on a reused/self-hosted runner, and it is what caught
          # a false pass in this PR's own local verification: a `test_ci` database left
          # over from an earlier manual run made a genuinely broken check (DATABASE_URL
          # pointed at sqlite, Postgres untouched) report PASS, because the check only
          # asked "does one exist" instead of "did THIS run make one".
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://ci:ci-only-not-a-real-password@127.0.0.1:5432/ci')
          conn.autocommit = True
          names = [r[0] for r in conn.execute(\"SELECT datname FROM pg_database WHERE datname LIKE 'test%'\").fetchall()]
          for n in names:
              conn.execute(f'DROP DATABASE \"{n}\"')
          print(f'pre-run cleanup: dropped {names}' if names else 'pre-run cleanup: nothing to drop')
          "

          cd apps/control-api
          # --reuse-db is CI-only, passed here rather than in pytest.ini (owned by the
          # backend developer). Without it pytest-django DROPS the test database at
          # teardown, and the check below would always find nothing regardless of what the
          # suite did — verified in this session, before the pre-run drop above was added.
          pytest -q --reuse-db

          # The suite can pass while never having opened a connection to Postgres at all —
          # that is exactly how BUG-022 went unnoticed. Assert Django actually created and
          # used a Postgres test database THIS run, not just that pytest exited 0.
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://ci:ci-only-not-a-real-password@127.0.0.1:5432/ci')
          conn.autocommit = True
          rows = conn.execute(\"SELECT datname FROM pg_database WHERE datname LIKE 'test%'\").fetchall()
          assert rows, (
              'no test_* database found on the Postgres service after this run — the '
              'suite did not touch Postgres. Check DATABASE_URL above.'
          )
          print(f'ok: pytest-django created and used {[r[0] for r in rows]} on this run')
          "

      # Runs AFTER the control-API install, on purpose and for the same reason as BUG-016.
      # gateway/tests/test_contract_alignment.py feeds the gateway's provenance record to
      # the control API's real ModelProvenance; without django-ninja importable it skips,
      # and a silently-skipping alignment test is how two definitions of the same three
      # fields drift apart between now and D6. `-rs` prints any skip that does happen.
      #
      # This step is also the one that makes the SEC-02 bypass table a gate rather than a
      # document: 60 cases, run on every pull request.
      - name: Model gateway tests
        run: |
          set -euo pipefail
          if [ ! -d services/model-gateway ]; then
            echo "services/model-gateway does not exist yet — skipping"
            exit 0
          fi
          pip install -r services/model-gateway/requirements-dev.txt
          cd services/model-gateway
          pytest -q -rs

      # The same table the security review will be re-run against, executed as a script so
      # its output is in the CI log verbatim and can be pasted into a review without
      # anybody re-deriving it. Exit code is driven by the gateway policy only; the
      # control-api column is #93's and is reported, not gated.
      - name: Endpoint policy bypass table
        run: |
          set -euo pipefail
          if [ ! -f infrastructure/scripts/testing/endpoint-policy-bypass-table.py ]; then
            echo "bypass table script not present — skipping"
            exit 0
          fi
          python infrastructure/scripts/testing/endpoint-policy-bypass-table.py

  # ---------------------------------------------------------------------------
  # Without this, issue #6's acceptance criterion — "a contract change breaks the frontend
  # build" — is simply false: a hand-committed OpenAPI dump drifts silently the first time
  # someone edits a schema and forgets to re-export, and everything downstream is then
  # generated from a description of an API that no longer exists.
  openapi-contract:
    name: openapi dump is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the control API
        run: |
          set -euo pipefail
          if [ ! -d apps/control-api ]; then
            echo "apps/control-api does not exist yet — nothing to install"
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -r apps/control-api/requirements.txt

      - name: Regenerate and diff (Python 3.12)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: infrastructure/scripts/openapi-contract-check.sh

      # #103 / D-049 part 3. The dump used to carry `http.HTTPStatus`'s reason phrases
      # straight from whichever interpreter ran the exporter, and 3.13 renamed four of
      # them — so the drift check failed for a reason that had nothing to do with the
      # contract. The exporter now pins them (CANONICAL_REASON_PHRASES).
      #
      # This second leg is the acceptance criterion, not decoration: the fix is only
      # worth anything if CI proves the dump is byte-identical on both, and a pin in
      # requirements.txt would hold only until someone ran it locally on something
      # newer — which is exactly how this was found.
      #
      # Added as steps in the same job rather than as a matrix, deliberately: a matrix
      # renames the required check from "openapi dump is current" to
      # "openapi dump is current (3.12)" and silently unsets branch protection.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Reinstall the control API on Python 3.13
        run: |
          set -euo pipefail
          if [ ! -d apps/control-api ]; then exit 0; fi
          python -m pip install --upgrade pip
          pip install -r apps/control-api/requirements.txt

      - name: Regenerate and diff (Python 3.13 — the dump must be interpreter-independent)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: infrastructure/scripts/openapi-contract-check.sh

  # ---------------------------------------------------------------------------
  # #16/#17/#27 (compiler-toolchain-engineer). "A suite CI does not collect is a suite
  # that does not exist" — this job is that line acted on. Without it, every claim in
  # adapters/cpp/tests and workers/baseline/tests — including the notrun-is-not-a-pass
  # regression test and the D3 gate rehearsal — would be true only on a laptop.
  #
  # ubuntu-24.04's default image ships cmake, make, gcc/g++ (with libasan/libubsan) and
  # `patch`, so no extra install step is needed for the demo target
  # (demo/repositories/pktcfg, plain CMake + CTest, no third-party dependencies). Versions
  # actually present are printed so a drifted runner image is visible in the log rather
  # than silently changing what "the toolchain" means between runs — the same reasoning
  # as the compiler/CMake version fields the adapter itself records per run
  # (adapters/cpp/toolchain.py).
  cpp-adapter:
    name: C/C++ adapter (#16, #17, #27)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Toolchain versions actually used this run
        run: |
          set -euo pipefail
          cmake --version
          ctest --version
          cc --version || true
          patch --version | head -1

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: C/C++ adapter and baseline worker tests
        run: |
          set -euo pipefail
          if [ ! -d adapters/cpp ]; then
            echo "adapters/cpp does not exist yet — nothing to test"
            exit 0
          fi
          pytest adapters/cpp/tests workers/baseline/tests -q -rs
