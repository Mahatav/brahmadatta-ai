# Brahmadatta AI — continuous integration.
#
# The CTO originally cut D1's CI scope to `pytest` and an OpenAPI dump
# freshness check, on the grounds that a lint matrix, a type-check matrix and a coverage
# gate are cost with no gate behind them in a seven-day build. The configuration for all
# of those still exists and is still run locally — see
# docs/04-development/31-development-setup-guide.md §Checks — it is just not spending
# runner minutes on every pull request this week.
#
# What is NOT in CI, and how it is covered instead:
#
#   ruff / mypy                         ruff.toml, mypy.ini — run locally
#   docker compose config, nginx -t      infrastructure/scripts/nginx-validate.sh
#   SSE survives the proxy               infrastructure/scripts/smoke-sse.sh
#   only nginx has egress (C4)           infrastructure/scripts/egress-test.sh
#   shellcheck, actionlint               run locally
#
# Those four scripts are the ones worth promoting back into CI first, in that order, when
# the budget for it exists. `smoke-sse.sh` and `egress-test.sh` guard invariants that fail
# silently, which is the argument for them going first.
#
# Design notes that survive the cut:
#   - Actions are pinned to a commit SHA, not a tag. A tag is mutable and can be repointed
#     at new code without any change on our side. Same rule as the image digest pins in
#     infrastructure/compose/.
#   - permissions is read-only. No job writes to the repository.
#   - No secret is used by any job. Nothing here talks to a paid service, a model provider,
#     or any external inference API.
#   - Steps that depend on a directory which does not exist yet skip cleanly and say so, so
#     an unrelated pull request does not go red while the tree is still filling in.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  frontend:
    name: command center
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/command-center/package-lock.json

      - name: Install frontend tooling
        run: npm ci

      - name: Install Command Center
        run: npm ci --prefix apps/command-center

      - name: Validate generated API types
        run: npm run check:api --prefix apps/command-center

      - name: Typecheck and build the static application
        run: npm run build --prefix apps/command-center

      - name: Lint frontend sources
        run: npm run lint

  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Folded in as a step rather than a third job: it takes two seconds, needs no setup,
      # and "no credential is ever committed" is not the kind of rule to leave to review
      # attention across a twelve-hour handoff.
      - name: No environment file, key, or certificate is tracked
        run: |
          set -euo pipefail
          bad="$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa|id_ed25519' \
            | grep -v -E '\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::tracked files that must never be committed:"
            echo "$bad"
            exit 1
          fi
          if git grep -I -n -E -- "-----BEGIN [A-Z ]*PRI""VATE KEY-----" -- . ; then
            echo "::error::private key material found in a tracked file"
            exit 1
          fi
          echo "ok: no tracked .env, private key, or certificate"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # BUG-016: this step used to run BEFORE control-api's dependencies existed, so the
      # import-direction check (C5) and the ingress-contract check could not import Django
      # and skipped silently — green, every run, testing nothing. Installing first turns
      # them back into real assertions.
      - name: Install control API dependencies
        run: |
          if [ -d apps/control-api ]; then
            pip install -r apps/control-api/requirements.txt
          else
            echo "apps/control-api does not exist yet — nothing to install"
          fi

      # Architecture invariants that hold regardless of what the application looks like:
      # the ASGI process must not import the gateway (C5), the Django half of the ingress
      # contract is set, and no container but nginx sits on a routable network.
      # No DJANGO_SETTINGS_MODULE here on purpose. Setting it makes pytest-django try to
      # bootstrap a Django project from the repository root, where there is no manage.py,
      # and the whole step dies on an ImportError before a single test runs. The tests that
      # need Django put apps/control-api on sys.path themselves.
      # `-rs` prints the reason for any skip, so a test that quietly stops asserting is
      # visible in the log rather than passing as a dot.
      - name: Architecture tests
        run: pytest tests/ -q -rs

      # The fixture and sandbox suites live outside `tests/` and outside apps/control-api,
      # so neither existing step collected them — they passed locally and did not exist as
      # far as CI was concerned. That made #71's central promise ("a contract change breaks
      # the fixture loudly") true on a laptop and false on the branch that matters.
      # Same shape as the bypass table gating only one of its two columns: a check nobody
      # can fail is a document.
      #
      # This references packages/sandbox/, not services/sandbox/. An earlier version of
      # this step (landed directly on this branch while the D-053 move was in flight)
      # still pointed at services/sandbox/ — the exact stale-path failure mode BUG-016
      # above already burned this project on once.
      #
      # SEC-34 (cybersecurity review of #113, Medium): an earlier version of this guard
      # printed a warning and then `exit 0`d when a directory was missing — a check
      # nobody can fail, the exact shape the CTO's own comment above this step warns
      # about, reproduced in the guard meant to prevent it. Fixed to fail the job.
      # `apps/control-api`'s existence check below is not the same situation and is not
      # touched by this: at D1 that directory legitimately did not exist yet, and
      # skipping cleanly during that bootstrap phase was correct. packages/sandbox and
      # packages/test-fixtures are added complete in this PR — there is no "not built
      # yet" phase for them from here on, so their absence in any future run can only
      # mean a regression, and reports as one.
      - name: Fixture and sandbox tests
        run: |
          set -euo pipefail
          missing=0
          for dir in packages/sandbox packages/test-fixtures; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir does not exist. Unlike apps/control-api at D1, this directory is not still being built — it shipped complete in PR #113. Its absence means something moved or deleted it without updating this workflow."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          pytest packages/sandbox/tests packages/test-fixtures/tests -q -rs

      - name: Control API tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DJANGO_DEBUG: "false"
          # sqlite so CI needs no database service. The compose stack and the finale both
          # use PostgreSQL; anything depending on Postgres-specific behaviour needs an
          # integration job with a service container, which is D2 work.
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: |
          set -euo pipefail
          if [ ! -d apps/control-api ]; then
            echo "apps/control-api does not exist yet — skipping"
            exit 0
          fi
          pip install -r apps/control-api/requirements.txt
          cd apps/control-api
          pytest -q

      # Runs AFTER the control-API install, on purpose and for the same reason as BUG-016.
      # gateway/tests/test_contract_alignment.py feeds the gateway's provenance record to
      # the control API's real ModelProvenance; without django-ninja importable it skips,
      # and a silently-skipping alignment test is how two definitions of the same three
      # fields drift apart between now and D6. `-rs` prints any skip that does happen.
      #
      # This step is also the one that makes the SEC-02 bypass table a gate rather than a
      # document: 60 cases, run on every pull request.
      - name: Model gateway tests
        run: |
          set -euo pipefail
          if [ ! -d services/model-gateway ]; then
            echo "services/model-gateway does not exist yet — skipping"
            exit 0
          fi
          pip install -r services/model-gateway/requirements-dev.txt
          cd services/model-gateway
          pytest -q -rs

      # The same table the security review will be re-run against, executed as a script so
      # its output is in the CI log verbatim and can be pasted into a review without
      # anybody re-deriving it. Exit code is driven by the gateway policy only; the
      # control-api column is #93's and is reported, not gated.
      - name: Endpoint policy bypass table
        run: |
          set -euo pipefail
          if [ ! -f infrastructure/scripts/testing/endpoint-policy-bypass-table.py ]; then
            echo "bypass table script not present — skipping"
            exit 0
          fi
          python infrastructure/scripts/testing/endpoint-policy-bypass-table.py

  # ---------------------------------------------------------------------------
  # Without this, issue #6's acceptance criterion — "a contract change breaks the frontend
  # build" — is simply false: a hand-committed OpenAPI dump drifts silently the first time
  # someone edits a schema and forgets to re-export, and everything downstream is then
  # generated from a description of an API that no longer exists.
  openapi-contract:
    name: openapi dump is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the control API
        run: |
          set -euo pipefail
          if [ ! -d apps/control-api ]; then
            echo "apps/control-api does not exist yet — nothing to install"
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -r apps/control-api/requirements.txt

      - name: Regenerate and diff (Python 3.12)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: infrastructure/scripts/openapi-contract-check.sh

      # #103 / D-049 part 3. The dump used to carry `http.HTTPStatus`'s reason phrases
      # straight from whichever interpreter ran the exporter, and 3.13 renamed four of
      # them — so the drift check failed for a reason that had nothing to do with the
      # contract. The exporter now pins them (CANONICAL_REASON_PHRASES).
      #
      # This second leg is the acceptance criterion, not decoration: the fix is only
      # worth anything if CI proves the dump is byte-identical on both, and a pin in
      # requirements.txt would hold only until someone ran it locally on something
      # newer — which is exactly how this was found.
      #
      # Added as steps in the same job rather than as a matrix, deliberately: a matrix
      # renames the required check from "openapi dump is current" to
      # "openapi dump is current (3.12)" and silently unsets branch protection.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Reinstall the control API on Python 3.13
        run: |
          set -euo pipefail
          if [ ! -d apps/control-api ]; then exit 0; fi
          python -m pip install --upgrade pip
          pip install -r apps/control-api/requirements.txt

      - name: Regenerate and diff (Python 3.13 — the dump must be interpreter-independent)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: infrastructure/scripts/openapi-contract-check.sh
