[pytest]
# Root-level marker registration only. `apps/control-api/pytest.ini` remains authoritative
# for anything invoked with that directory as the rootdir (e.g. `cd apps/control-api &&
# pytest -q`) — pytest resolves the ini nearest the invocation directory, so the two do
# not collide. This file exists so `pytest adapters/cpp/tests workers/baseline/tests` run
# from the repo root does not warn about an unregistered marker.
markers =
    slow: exercises real cmake/ctest/clang subprocesses (seconds, not milliseconds). Run by default in CI; use `-m "not slow"` for a fast local pass.
