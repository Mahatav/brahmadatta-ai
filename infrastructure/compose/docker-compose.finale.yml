# Brahmadatta AI — FINALE stack.
#
#   infrastructure/scripts/finale-up.sh
#   docker compose -f infrastructure/compose/docker-compose.finale.yml --env-file .env up -d
#
# STANDALONE, not an overlay on docker-compose.yml, and that is deliberate. Compose merges
# a `volumes:` list by mount target, so an overlay can replace a mount but cannot DELETE
# one. The dev stack bind-mounts the live source at /app; the finale stack must not have
# that mount at all. An overlay physically cannot express "no source bind mount", and a
# finale profile that silently keeps a writable source mount is exactly the kind of
# difference that is discovered during the demo. Duplication here is cheaper than that.
# Recorded as D-019 in .project/decisions.md.
#
# Every difference from docker-compose.yml, in full:
#   1. nginx mounts templates.finale/ and profile/admin-deny.conf  -> /admin returns 404
#   2. control-api uses the `runtime` image target; the source is baked in, not mounted
#   3. no Astro dev server; nginx serves the built static output
#   4. redis requires a password
#   5. UVICORN_FORWARDED_ALLOW_IPS is the edge subnet, not "*"
#   6. no port is published except through nginx, and nginx serves the stage origin on
#      http://localhost:8080 so the operator never sees a self-signed certificate warning
#   7. no Astro dependency-installer service — the finale has no npm step at all, so this
#      stack satisfies C4 with no exception whatsoever
#
# UNVERIFIED as of D1: this file has never been brought up. apps/command-center/ does not
# exist, so `dist/` does not exist, so nginx has nothing to serve. `docker compose config`
# validates it and `nginx -t` validates its configuration; nothing else has been run.
#
# #230 (fast-follow on D-099/PR #219): same fix as docker-compose.yml's matching header
# comment, mirrored here — `container_name:`, nginx's published host port, and the `api`
# network's pinned subnet all parameterized the same way, all defaulting to today's exact
# values, all overridden by finale-up.sh only for a linked worktree.

name: brahmadatta-finale

x-env: &env-file
  env_file:
    - path: ../../.env
      required: false

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    image: nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-nginx
    <<: *hardening
    read_only: true
    tmpfs:
      # SEC-04 (#95) / SEC-38 (#132): bounded, with 25% headroom above the 512m
      # snapshot body ceiling. See the matching development-profile comment.
      - /tmp:size=640m
      - /var/cache/nginx
      - /var/run
      # D-088 (T0): NGINX_ENVSUBST_OUTPUT_DIR default — see the matching
      # development-profile comment for the full reasoning (`mode=1777`, uid 101
      # ownership). Same idiom model-host-auth already uses in docker-compose.yml.
      - /etc/nginx/conf.d:mode=1777
    cap_drop: ["ALL"]
    environment:
      # D-088 (T0): required, not defaulted, unlike the dev profile — the finale stack
      # already fails loud rather than silently running with a blank secret for every
      # other required credential in this file (DATABASE_URL, REDIS_PASSWORD, ...); an
      # unset operator token here would otherwise mean every proxied request 401s
      # through the whole stage run with no obvious cause. See
      # templates.finale/brahmadatta.conf.template's header comment for where this is
      # consumed.
      #
      # Deliberately NOT via the `*env-file` (`x-env`) anchor control-api uses below —
      # see the matching development-profile comment in docker-compose.yml for the full
      # reasoning (cybersecurity review of T0: `env_file:` would give nginx, the ONLY
      # container with a route off the host, every credential in `.env`, not just the
      # one its own config reads). `${VAR}` interpolation below resolves from
      # `--env-file`/the process environment at compose-parse time regardless of
      # whether `env_file:` is also declared, so this one line is sufficient on its own.
      CONTROL_API_OPERATOR_TOKEN: ${CONTROL_API_OPERATOR_TOKEN:?CONTROL_API_OPERATOR_TOKEN must be set for the finale stack}
      # Restricts the entrypoint's envsubst call to this ONE variable name — see the
      # long comment at the top of templates.finale/brahmadatta.conf.template for why an
      # unrestricted envsubst pass would corrupt nginx's own `$host`/`$request_uri`/etc.
      # variable syntax in that file.
      NGINX_ENVSUBST_FILTER: "^CONTROL_API_OPERATOR_TOKEN$"
    ports:
      # Published on loopback: the stage browser runs on the same machine. Keep the
      # finale origin plain HTTP so there is no browser TLS warning on stage.
      # #230: host port parameterized, container port is not — see docker-compose.yml's
      # matching comment on its own nginx `ports:` block for the full reasoning.
      - "127.0.0.1:${NGINX_FINALE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      # THE PROFILE SWITCH — this is the whole finale admin control at the proxy.
      # admin-deny.conf returns 404 for /admin and /django-admin.
      - ./nginx/profile/admin-deny.conf:/etc/nginx/profile/admin.conf:ro
      # D-088 (T0): templates, not a pre-rendered conf.d/ bind mount any more — see
      # templates.finale/brahmadatta.conf.template's header comment and the matching
      # development-profile compose comment for why this mounts at
      # /etc/nginx/templates, not /etc/nginx/conf.d.
      - ./nginx/templates.finale:/etc/nginx/templates:ro
      # The Astro build output. Produced by `npm run build` in apps/command-center before
      # this stack starts; finale-up.sh refuses to start without it.
      - ../../apps/command-center/dist:/usr/share/nginx/html:ro
      # Django's collected static, written by the control-api container.
      - django-static:/srv/django-static:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    networks:
      # C4: the only service on `external`, and therefore the only container in this stack
      # with a route off the host.
      - external
      - api
    depends_on:
      control-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  control-api:
    build:
      context: ../../apps/control-api
      dockerfile: ../../infrastructure/compose/images/control-api.Dockerfile
      target: runtime          # source baked in; nothing mounted
      # D-032: control-api.Dockerfile's `runtime` target COPYs demo/repositories in at
      # build time instead of it being bind-mounted (see that Dockerfile's comment).
      # demo/ sits outside this build's own context (apps/control-api/), so it is
      # supplied as a second, named build context rather than a path inside `context:`.
      #
      # workers-source/packages-source/adapters-source: the fix for the live #168/#174
      # regression where `missions/apps.py`'s `ready()` (imported unconditionally by every
      # Django process, including this one) raised `ModuleNotFoundError: No module named
      # 'workers'` on every container boot — `workers/`, `packages/`, `adapters/` are
      # siblings of `apps/`, same as `demo/`, and were never reachable from inside this
      # build context either. See control-api.Dockerfile's matching comment for the full
      # reasoning and fix/168-docker-build-context for the verified failure/fix.
      additional_contexts:
        demo-repositories: ../../demo/repositories
        workers-source: ../../workers
        packages-source: ../../packages
        adapters-source: ../../adapters
        # D-100: services/model-gateway/, so `gateway.*` is importable inside this
        # image at all. See control-api.Dockerfile's matching COPY comment.
        model-gateway-source: ../../services/model-gateway
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-control-api
    <<: [*env-file, *hardening]
    read_only: true
    tmpfs:
      # SEC-04 (#95) / SEC-38 (#132): Django may spool the full snapshot body here.
      - /tmp:size=640m
    cap_drop: ["ALL"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.finale
      DJANGO_DEBUG: "false"
      # config.settings.finale forces the admin off regardless; this is the second lock.
      # The proxy 404 is the third. All three are required — blocking a route at the proxy
      # does nothing to anyone who can reach the container directly.
      CONTROL_API_ADMIN_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for the finale stack}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set for the finale stack}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set to the finale hostname}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set to the finale origin}
      # Trust proxy headers only from the compose edge subnet. "*" here would let anything
      # that can reach the container claim X-Forwarded-Proto: https.
      UVICORN_FORWARDED_ALLOW_IPS: ${UVICORN_FORWARDED_ALLOW_IPS:-172.31.0.0/24}
      # Persistent database connections are THREAD-LOCAL under ASGI. A held SSE stream
      # occupies a thread for the life of the connection, and with CONN_MAX_AGE > 0 that
      # thread's Postgres connection is pinned idle alongside it. Five operator tabs on a
      # long mission is five idle connections doing nothing but consuming a slot.
      #
      # The AUTHORITATIVE setting is `CONN_MAX_AGE: 0` in
      # apps/control-api/config/settings/finale.py, asserted by
      # tests/architecture/test_ingress_contract.py. This variable mirrors it so the value
      # is visible where the deployment is described, and so a future settings module that
      # does read it from the environment gets the right answer.
      CONN_MAX_AGE: "0"
      # `config.settings.base.ARTIFACT_ROOT` defaults to `BASE_DIR / "var" / "artifacts"`
      # (`/app/var/artifacts`) — inside `/app`, which the `runtime` image target bakes in
      # read-only and this service's own `read_only: true` enforces at the container
      # level too. The content-addressed snapshot store has therefore never been able to
      # write a single byte under the finale profile: `POST .../snapshot` 500s on
      # `OSError: [Errno 30] Read-only file system: '/app/var'` the moment it tries to
      # materialize the tar it just built. Repointed at a named volume, same pattern as
      # `evidence:` below. Found running the #50 live rehearsal, 2026-08-17.
      ARTIFACT_ROOT: /var/lib/brahmadatta/artifacts
      # D-100: config.settings.base.MODEL_GATEWAY_ROOT's default only resolves
      # correctly bare-metal (REPO_ROOT/services/model-gateway) — inside this image
      # REPO_ROOT collapses to the container filesystem root, which does not hold
      # services/model-gateway. Pointed explicitly at where the `runtime` image target
      # actually bakes it in — see control-api.Dockerfile's `COPY --from=
      # model-gateway-source` and this service's own `additional_contexts` above.
      MODEL_GATEWAY_ROOT: /app/services/model-gateway
    volumes:
      - django-static:/app/staticfiles
      # Evidence artifacts survive a container replacement.
      - evidence:/var/lib/brahmadatta/evidence
      # The content-addressed snapshot artifact store — see the ARTIFACT_ROOT comment
      # above. Distinct from `evidence`: this is ingested snapshot bytes, not exported
      # evidence bundles.
      - artifacts:/var/lib/brahmadatta/artifacts
      # NOTE: no bind mount for `/demo/repositories` here — D-032 forbids a host-path
      # mount into finale control-api. It is baked into the `runtime` image at build
      # time instead; see the `additional_contexts` block above and
      # control-api.Dockerfile's `COPY --from=demo-repositories`.
    networks:
      # `api`, NOT a shared ingress network. nginx is the only other member.
      - api
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    # TLS-enabled build of the same pinned postgres digest — see images/postgres-tls.Dockerfile
    # for why this is baked in at build time rather than bind-mounted. Required by
    # brahmadatta.E005: APP_ENV=finale refuses to start against an unencrypted DATABASE_URL.
    build:
      context: .
      dockerfile: images/postgres-tls.Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-db
    <<: *hardening
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brahmadatta}
      POSTGRES_USER: ${POSTGRES_USER:-brahmadatta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the finale stack}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brahmadatta} -d ${POSTGRES_DB:-brahmadatta}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103  # 8.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-redis
    <<: *hardening
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for the finale stack}
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 60 1 --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # D-073 — this container claims every JobKind EXCEPT FUZZ/MINIMIZE, BY DESIGN. It has
  # no `docker` CLI and D-036 forbids ever mounting the host's Docker socket into it, so
  # it structurally cannot run `packages.sandbox.container.ContainerJail` — what FUZZ/
  # MINIMIZE need. FUZZ/MINIMIZE run instead on `fuzz-worker`, a bare-metal process on
  # the finale host (infrastructure/scripts/run-fuzz-worker.sh), NOT a service in this
  # file — `python manage.py run_worker --kinds FUZZ,MINIMIZE`, the only process in this
  # system ever given container-runtime access, deliberately given no model-gateway
  # client and no route to model-host. Do not "fix" this by mounting the socket here or
  # by widening this service's claimed kinds — see D-036/D-073 in .project/decisions.md.
  # `fuzz-worker`'s Postgres reachability from the bare-metal host is an OPEN, UNRESOLVED
  # question for this file specifically — see the D-073 follow-up entry in that log for
  # why it is not silently resolved here the way it was for docker-compose.yml's dev
  # profile.
  worker:
    profiles: ["worker"]
    build:
      context: ../../apps/control-api
      dockerfile: ../../infrastructure/compose/images/control-api.Dockerfile
      target: runtime
      # Mirrors control-api's additional_contexts above — same image target, same
      # build-time COPY of demo/repositories, same D-032 reasoning, and the same
      # workers-source/packages-source/adapters-source fix for the #168/#174
      # ModuleNotFoundError regression (worker needs this at least as much as
      # control-api: it is the process that actually runs the stage executors).
      additional_contexts:
        demo-repositories: ../../demo/repositories
        workers-source: ../../workers
        packages-source: ../../packages
        adapters-source: ../../adapters
        # D-100: services/model-gateway/, so `gateway.*` is importable inside this
        # image at all. See control-api.Dockerfile's matching COPY comment.
        model-gateway-source: ../../services/model-gateway
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-worker
    <<: [*env-file, *hardening]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.finale
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for the finale stack}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set for the finale stack}
      # Mirrors control-api's ARTIFACT_ROOT fix above, for parity if this profile is
      # ever activated. NOT independently verified working end to end — see #50's
      # evidence bundle: `CONTROL_API_WORKER_CMD`'s default (`manage.py rqworker`)
      # has no `django_rq` in requirements.txt and was never reached by this rehearsal.
      ARTIFACT_ROOT: /var/lib/brahmadatta/artifacts
      # D-100: same fix and reasoning as control-api's own MODEL_GATEWAY_ROOT above —
      # this is the process that actually runs JobKind.PATCH_GENERATE, so it needs
      # `gateway.*` importable at least as much as control-api does, in principle,
      # once this profile is activated (see the NOT independently verified note above).
      MODEL_GATEWAY_ROOT: /app/services/model-gateway
      SANDBOX_FUZZ_IMAGE: ${SANDBOX_FUZZ_IMAGE:-}
    command: ${CONTROL_API_WORKER_CMD:-python manage.py rqworker default}
    volumes:
      - evidence:/var/lib/brahmadatta/evidence
      - artifacts:/var/lib/brahmadatta/artifacts
      # NOTE: no bind mount for `/demo/repositories` here — see control-api's identical
      # note above. Baked into the image via `additional_contexts` instead.
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  model-host:
    profiles: ["model"]
    image: ollama/ollama@sha256:f478761c18fea69b1624e095bce0f8aab06825d09ccabcd0f88828db0df185ce
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-model-host
    <<: *hardening
    mem_limit: ${MODEL_HOST_MEM_LIMIT:-8g}
    environment:
      # D-075 / SEC-50: loopback-only inside this container's own network namespace.
      # See docker-compose.yml's matching comment for the full reasoning — this is the
      # HIGH/CRITICAL-rated fix for the finale deployment specifically (cybersecurity's
      # SEC-50 finding on PR #197). `model-host-auth` below is the only thing that can
      # still reach it.
      #
      # Port 11435, not 11434: see docker-compose.yml's matching comment — nginx binds
      # `11434` itself, wildcard, and a wildcard bind there collides with an exact
      # `127.0.0.1:11434` bind in the same namespace at the kernel level.
      OLLAMA_HOST: 127.0.0.1:11435
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  # model-host-auth — D-075 / SEC-50. See docker-compose.yml's matching service for the
  # full reasoning. MODEL_HOST_BEARER_TOKEN is REQUIRED here (`:?`), the same way
  # POSTGRES_PASSWORD/REDIS_PASSWORD already are for this file — the finale stack does
  # not start with `--profile model` unless a real token is set.
  model-host-auth:
    profiles: ["model"]
    image: nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta-finale}-model-host-auth
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      # mode=1777: see docker-compose.yml's matching, longer comment — a bare tmpfs
      # mount here comes back root:root 0775, unwritable by this image's uid 101.
      - /etc/nginx/conf.d:mode=1777
    cap_drop: ["ALL"]
    environment:
      MODEL_HOST_BEARER_TOKEN: ${MODEL_HOST_BEARER_TOKEN:?MODEL_HOST_BEARER_TOKEN must be set for the finale stack}
    volumes:
      - ./nginx/model-host-auth/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/model-host-auth/templates:/etc/nginx/templates:ro
    network_mode: "service:model-host"
    depends_on:
      model-host:
        condition: service_healthy
    restart: "no"

networks:
  # C4: only nginx sits here, and only this network has a gateway. Everything that can hold
  # a repository snapshot or assemble a prompt is on `edge`/`backend`, both internal, and
  # has no route off the host at any layer. See the same block in docker-compose.yml.
  external:
    driver: bridge

  # nginx <-> control-api. No gateway, no third member. There is no `edge` network in the
  # finale stack at all, because there is no Astro dev server to put on it.
  api:
    driver: bridge
    internal: true
    ipam:
      config:
        # Fixed subnet so UVICORN_FORWARDED_ALLOW_IPS can name it instead of "*".
        # #230: parameterized on that same variable (see control-api's environment block
        # below) rather than a new one, since the two already had to agree. finale-up.sh
        # overrides it for a linked worktree so two worktrees' `api` networks do not
        # collide; the primary checkout keeps today's 172.31.0.0/24.
        - subnet: ${UVICORN_FORWARDED_ALLOW_IPS:-172.31.0.0/24}

  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  nginx-logs:
  django-static:
  evidence:
  artifacts:
  ollama-models:
