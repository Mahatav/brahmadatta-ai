# Django admin — DEVELOPMENT posture.
#
# This file is mounted at /etc/nginx/profile/admin.conf by the development compose file.
# The finale compose file mounts profile/admin-deny.conf at the same path instead. The
# server block includes `/etc/nginx/profile/admin.conf` and never names either file, so the
# posture is chosen entirely by the mount and there is no config edit at deploy time.
#
# It lives in profile/ rather than includes/ because includes/ is bind-mounted read-only as
# a whole directory, and Docker cannot create a new mountpoint inside a read-only mount.
#
# D-013 lists an exposed Django admin as the security hazard the stack change introduced.
# It is genuinely useful mid-build for inspecting evidence records, so dev keeps it — but
# only from RFC1918 space and loopback, so a laptop on a conference or hotel network does
# not serve it to the room.
#
# SEC-08 (#97): this guarded `^~ /admin/` while Django serves the admin at
# `/django-admin/` (config/urls.py) — STATIC_URL = "/django-static/" is the same story for
# the admin's own CSS/JS. The guard protected a path that does not exist and left the real
# one unguarded in this profile. Low severity because admin-deny.conf (the finale mount)
# already blocks both `/admin` and `/django-admin` prefixes independently and correctly —
# this file only governs the development posture.

location ^~ /django-admin/ {
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    include /etc/nginx/includes/security-headers.conf;

    # Variable form so this file works with the dev config's runtime-resolved upstreams.
    # In the finale profile this file is not mounted at all; admin-deny.conf is.
    proxy_pass http://$control_api$request_uri;
    include /etc/nginx/includes/proxy-common.conf;
}

# Django serves the admin's own CSS/JS from STATIC_URL = "/django-static/". Behind the
# same allow-list as the admin location itself — CSS is not sensitive, but an unguarded
# proxy location under /django-admin's namespace is one more thing to have to reason
# about, and the admin is unusable without it loading anyway.
location ^~ /django-static/ {
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    include /etc/nginx/includes/security-headers.conf;

    proxy_pass http://$control_api$request_uri;
    include /etc/nginx/includes/proxy-common.conf;
}
