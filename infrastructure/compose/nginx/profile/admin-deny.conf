# Django admin — FINALE posture. BLOCKED AT THE PROXY.
#
# Mounted at /etc/nginx/profile/admin.conf by docker-compose.finale.yml, replacing
# profile/admin-allow.conf. Acceptance criterion on issue #10 and the hazard named in
# D-013.
#
# 404, not 403: a 403 confirms that something is there. A 404 is indistinguishable from a
# path that was never routed, which is what we want a judge's laptop — or anyone else on
# the finale network — to see.
#
# `^~` beats the regex locations in the same server block, so this cannot be bypassed by a
# later regex match. The trailing-slash-free prefix is deliberate: /admin, /admin/,
# /adminfoo and /admin/../ all land here.
#
# This is defence in depth, not the only control. The API must ALSO be started with the
# admin site unmounted in the finale profile (BRAHMADATTA_ENABLE_ADMIN=false in .env) —
# blocking a route at the proxy does nothing if someone reaches the container directly.

location ^~ /admin {
    access_log /var/log/nginx/access.log json_combined;
    return 404;
}

# Common alternate mount points, blocked for the same reason.
location ^~ /django-admin {
    return 404;
}
