# Proxy headers only — no timeouts, no buffering.
#
# Split out from proxy-common.conf on purpose. nginx rejects a duplicate
# proxy_read_timeout in the same context, so the SSE location cannot include a file that
# already sets one. Every proxying location includes THIS file, then either
# includes/proxy-common.conf (normal request timeouts) or includes/sse.conf (stream
# timeouts + proxy_buffering off).
#
# Host is $http_host, NOT $host. $host drops the port, so on a dev origin of
# https://localhost:8443 Django would build absolute URLs as https://localhost/... and
# every redirect and every OpenAPI server URL would point at the wrong port. $http_host is
# the verbatim inbound Host header, port included.
#
# The Django side must opt in to trusting these — the control-api owner's half of the
# contract, written up in docs/06-operations/71-ingress-and-proxy-contract.md:
#     USE_X_FORWARDED_HOST = True
#     SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
# Without those two settings Django will still build http:// URLs behind this proxy.
#
# nginx overwrites these headers on every request, so a client cannot spoof
# X-Forwarded-Proto to make Django believe a plaintext request arrived over TLS.

proxy_http_version 1.1;

proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Port  $server_port;

# One rule covers both cases, which is why no location overrides it (a second
# proxy_set_header Connection in the same context would send the header twice):
#   client sent Upgrade  -> $connection_upgrade = "upgrade"  -> WebSocket/HMR works
#   client sent nothing  -> $connection_upgrade = ""         -> header omitted, upstream
#                                                               keepalive works
# The map is in nginx.conf.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_redirect off;
proxy_connect_timeout 5s;

# ---------------------------------------------------------------------------
# Suppress the upstream's copy of every header this ingress owns.
#
# This is not theoretical tidiness. Observed on 2026-08-07 against the D1 control API:
# Django's SecurityMiddleware sets `Referrer-Policy: same-origin` and nginx sets
# `Referrer-Policy: no-referrer`. nginx's add_header APPENDS, so the response carried
# both, and which one a browser honours is not something to leave to chance. Same for
# X-Frame-Options, X-Content-Type-Options and Cross-Origin-Opener-Policy.
#
# Issue #10's premise is that the ingress is the single place these are enforced, so the
# ingress wins and the upstream's copies are dropped here. Two consequences the backend
# developer needs to know, and which are in the D1 handoff:
#   - Django's SECURE_* header settings have no effect on anything served through nginx.
#     They still matter for a bare `runserver`, so leaving them set is correct.
#   - A per-view Content-Security-Policy cannot be set from Django. If one is ever needed,
#     it has to be added here instead.
#
# X-Trace-Id is deliberately NOT hidden: it is the API's, the log format reads it, and the
# operator needs it to correlate a UI event with a mission log line.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Robots-Tag;
# Django sends `Server: WSGIServer/...` or uvicorn sends `server: uvicorn`; neither should
# reach a client. nginx's own Server header is already minimised by server_tokens off.
proxy_hide_header Server;
