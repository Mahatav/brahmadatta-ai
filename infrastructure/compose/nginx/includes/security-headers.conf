# Security response headers.
#
# docs/03-technical/23-security-plan.md states controls, not header names. This file is the
# concrete implementation of the two controls that land at the ingress — "prevent source
# leakage" and "private service networks" — plus the standard browser hardening set. The
# mapping is written out in docs/06-operations/71-ingress-and-proxy-contract.md.
#
# `always` is required: without it nginx omits the header on 4xx/5xx responses, which are
# exactly the responses an attacker is most likely to be looking at.
#
# NGINX GOTCHA, read before editing: add_header directives are inherited from the enclosing
# block ONLY IF the inner block declares no add_header of its own. A single `add_header
# Cache-Control ...` inside a location silently drops every header set at server level.
# That is why every location in conf.d that adds a header re-includes this file.
#
# Content-Security-Policy is NOT here — it differs between dev (Astro HMR needs inline
# script and a ws: connect-src) and finale. See includes/csp-dev.conf / csp-finale.conf.
# Strict-Transport-Security is NOT here either — see includes/hsts.conf and the note in it.

add_header X-Content-Type-Options    "nosniff"                     always;
add_header X-Frame-Options           "DENY"                        always;
add_header Referrer-Policy           "no-referrer"                 always;
add_header Cross-Origin-Opener-Policy   "same-origin"              always;
add_header Cross-Origin-Resource-Policy "same-origin"              always;
# Cross-Origin-Embedder-Policy is finale-only (see includes/csp-finale.conf). require-corp
# breaks Astro's dev-server injected assets, and turning it on in dev would cost more
# debugging time than it buys during a seven-day build.

# The Command Center needs no device APIs at all. Deny the lot.
add_header Permissions-Policy
    "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
    always;

# This interface shows authorized-target vulnerability evidence. It is never indexed.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
