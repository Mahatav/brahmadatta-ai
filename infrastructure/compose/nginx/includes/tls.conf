# TLS parameters, shared by the dev and finale server blocks.
#
# The certificate paths are intentionally the same in both profiles. What changes is what
# is mounted there:
#
#   dev    — a self-signed cert generated by infrastructure/scripts/gen-dev-certs.sh into
#            infrastructure/compose/nginx/certs/. Never committed; .gitignore already
#            refuses *.pem and *.key repo-wide, and certs/ has its own .gitignore too.
#   finale — see docs/06-operations/71-ingress-and-proxy-contract.md §"Finale TLS path".
#            Short version: if the finale box has a public DNS name, certbot writes to a
#            host directory bind-mounted at the same container path and the ACME challenge
#            location in templates.finale/ serves the token. If it does not — a closed
#            competition LAN is the likely case — the finale runs the same self-signed
#            material with the cert fingerprint recorded in the runbook, because a browser
#            trust warning during a live demo is worse than the warning itself.
#
# TLS 1.2 is kept alongside 1.3 only because the finale machine and its browser are not
# yet known. If the demo runs on a browser we control, drop 1.2.

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:BrahmadattaTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Self-signed material has no OCSP responder, so stapling stays off in both profiles until
# a real chain exists.
ssl_stapling off;
