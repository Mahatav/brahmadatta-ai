# Ordinary (non-streaming) proxying: headers + request-shaped timeouts.
#
# Do NOT include this file in the SSE location. Use includes/sse.conf there instead —
# it sets the stream timeouts and turns buffering off, and including both would give
# nginx a duplicate proxy_read_timeout and refuse to start.

include /etc/nginx/includes/proxy-headers.conf;

proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffering left at nginx's default (on) here. That is the right behaviour for finite
# responses: nginx drains the ASGI worker quickly and feeds slow clients itself.
proxy_buffer_size   8k;
proxy_buffers       16 8k;
proxy_busy_buffers_size 16k;
