# Content-Security-Policy — DEVELOPMENT ONLY.
#
# Deliberately looser than the finale policy, and the difference is itemised so nobody
# copies this file into a finale profile by accident:
#
#   'unsafe-inline' script-src  — Astro's dev server injects an inline HMR bootstrap.
#   'unsafe-eval'   script-src  — Vite's dev transform pipeline evaluates module code.
#   ws: / wss: connect-src      — the HMR socket.
#
# All three are absent from includes/csp-finale.conf. If the finale build needs any of
# them, that is a bug in the frontend build, not a reason to relax the finale policy.
#
# `data:` on img-src covers inline SVG data URIs from the Core rendering.

add_header Content-Security-Policy
    "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; manifest-src 'self'"
    always;
