# HTTP Strict-Transport-Security — FINALE PROFILE ONLY.
#
# Included by conf.d.finale/brahmadatta.conf and deliberately NOT by conf.d.dev/.
#
# Why dev does not send it: the dev origin is https://localhost:8443 with a self-signed
# certificate. HSTS is keyed on hostname, ignores the port, and is not scoped to a
# certificate. Sending it once from localhost pins EVERY http://localhost:<anything> on
# that developer's browser to HTTPS — including unrelated projects — for a year, with no
# UI to undo it short of chrome://net-internals#hsts. Losing a day of someone's shift to
# that in a seven-day build is not a trade worth making for a header that protects nothing
# on loopback.
#
# No `preload`. Preload submission is irreversible on browser timescales and this hostname
# does not exist yet.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
