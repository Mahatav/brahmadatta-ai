# Content-Security-Policy — FINALE / production profile.
#
# No 'unsafe-inline' and no 'unsafe-eval' on script-src, and no ws:/wss: wildcard on
# connect-src. Mission updates arrive over SSE, which is a plain same-origin fetch and is
# covered by connect-src 'self'.
#
# style-src keeps 'unsafe-inline' because Astro emits inline <style> blocks for scoped
# component styles. Removing it needs either a nonce (which nginx cannot generate without
# a module) or `inlineStylesheets: 'never'` in the Astro config — a frontend decision, not
# an ingress one. Recorded as an open question in the D1 handoff.
#
# upgrade-insecure-requests is safe here because TLS terminates at this proxy and plaintext
# is redirected.

add_header Content-Security-Policy
    "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    always;

# Finale-only. See the note in includes/security-headers.conf.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
