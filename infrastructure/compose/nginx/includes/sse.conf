# ============================================================================
# SERVER-SENT EVENTS
# ============================================================================
#
# Include this file INSTEAD OF includes/proxy-common.conf on the event-stream location.
# It pulls in the shared headers itself. Including both gives nginx a duplicate
# proxy_read_timeout and it refuses to start.
#
# Every claim below was measured on 2026-08-07 against the committed config, on
# nginx 1.27.5 and 1.29.8 (nginxinc/nginx-unprivileged), with a 12-frame stub emitting a
# ~110-byte frame every 0.4s. The raw numbers are in
# docs/06-operations/72-sse-buffering-measurements.md. Directives whose necessity was NOT
# demonstrated are labelled as such rather than dressed up. Issue #114.
#
# ---------------------------------------------------------------------------
# proxy_buffering off — REQUIRED for HTTP/1.1 consumers. Demonstrated.
# ---------------------------------------------------------------------------
#
#   proxy_buffering off  ->  12 frames, first at 0.003s, spread over 4.44s
#   proxy_buffering on   ->  12 frames, ALL of them at 4.86s, spread 0.000s
#
# With buffering on, nothing reaches the client until the upstream response ENDS. A
# mission event stream does not end. The browser's EventSource stays open, the API happily
# writes events, no error appears in any log, and the Command Center never renders one.
#
# The mechanism is a BYTE THRESHOLD, not the end of the response, and that distinction is
# why the naive reproduction attempt fails. nginx releases the accumulated buffers once
# roughly 16 KB has piled up. Sweeping the frame size with buffering on, first frame out:
#
#     110 B/frame  ->  4.86s  (i.e. never, on a real stream)
#     512 B        ->  4.86s
#   1,400 B        ->  4.05s
#   1,600 B        ->  3.64s
#   4,096 B        ->  1.21s
#   8,192 B        ->  0.41s
#  16,384 B        ->  0.004s   <- no stall at all
#
# So anyone testing with fat frames concludes buffering is harmless. Our frames are
# ~110-400 bytes, which is 40-150 events of silence: the whole demo.
#
# ---------------------------------------------------------------------------
# HTTP/2 does NOT stall, and that is the trap in this whole area.
# ---------------------------------------------------------------------------
#
# Same nginx, same buffering-on config, same 110-byte frames, negotiated over ALPN h2:
#
#   h2, proxy_buffering on   ->  12 frames, first at 0.108s, spread 4.355s  (STREAMING)
#   h2, proxy_buffering off  ->  12 frames, first at 0.109s, spread 4.358s  (STREAMING)
#
# The stall is HTTP/1.1-only. Both listeners here have `http2 on`, so a BROWSER talking to
# the Command Center would very likely survive without this file. That is not a reason to
# drop it:
#
#   - every non-browser consumer of the stream is HTTP/1.1 — curl, urllib, requests,
#     httpx without the h2 extra, and every test harness in this repository
#   - the moment a second proxy hop, a load balancer, or an `http2 off` lands in front of
#     the ingress, the transport downgrades and the stall is total
#   - it costs nothing
#
# It IS the reason a probe can report "buffering is fine" and be wrong: curl negotiates
# HTTP/2 by default over TLS. Any reproduction attempt must pin HTTP/1.1.
# infrastructure/scripts/testing/sse-timing-probe.py pins it via ALPN for exactly this
# reason.
#
# ---------------------------------------------------------------------------
# proxy_read_timeout 3600s — REQUIRED. Demonstrated.
# ---------------------------------------------------------------------------
#
# It measures the gap between two reads FROM THE UPSTREAM, so it is an idle-stream
# setting, not a busy-stream one. With a stub that emits 2 frames and then goes silent for
# 20 seconds:
#
#   proxy_read_timeout 3600s  ->  6 frames, spread 21.6s, stream survived the gap
#   proxy_read_timeout 5s     ->  nginx closed the CLIENT connection at 5.411s, 2 frames
#
# Between mission phases — a fuzzing campaign, a ten-attempt patch generation run —
# nothing is emitted for minutes, and the nginx default of 60s would drop the connection
# mid-mission with no error the operator can see. One hour covers the longest phase in
# docs/09-company/03-seven-day-plan.md. The API should also emit a `: keepalive` comment
# line every 15s so a genuinely dead TCP path is detected long before this fires.
#
# ---------------------------------------------------------------------------
# gzip off — REQUIRED ONLY IF gzip is ever made to apply here. Demonstrated conditionally.
# ---------------------------------------------------------------------------
#
#   gzip on, nothing else            ->  first frame at 0.003s. No effect whatsoever.
#   gzip on + gzip_proxied any
#          + gzip_types text/event-stream
#                                    ->  Content-Encoding: gzip, ZERO decodable frames in
#                                        9 seconds. Total stall.
#
# `gzip on` alone does nothing to this stream because nginx defaults `gzip_proxied off`
# (proxied responses are never compressed) and `gzip_types text/html` (our content type is
# not in the list). That is why casually flipping gzip on and seeing no breakage proves
# nothing. When gzip does apply, its own output buffering coalesces frames and the stream
# dies exactly as buffering does. Keeping `gzip off` here means a future
# `gzip_types text/event-stream` in the http block cannot reach this location.
#
# ---------------------------------------------------------------------------
# proxy_cache off — PRUDENT, NOT DEMONSTRATED. Kept deliberately.
# ---------------------------------------------------------------------------
#
# The old comment claimed a cached infinite response is an infinite cache write. That was
# not observed. With a real `proxy_cache_path` zone, `proxy_cache` enabled, and
# `proxy_ignore_headers Cache-Control` so the stub's `no-cache` could not opt out:
#
#   stream still arrived incrementally, first frame at 0.004s
#   /tmp/expcache stayed empty (4.0K, no files) during the stream AND after it ended
#
# nginx does not commit a cache entry for a response it never saw complete. So this line
# is a guard against a future `proxy_cache` in the http block changing behaviour we have
# not characterised, not a fix for an observed failure. It costs one directive. Keep it,
# but do not cite it as a control.
#
# ---------------------------------------------------------------------------
# Things checked and found NOT to matter
# ---------------------------------------------------------------------------
#
#   nginx version       1.27.5 and 1.29.8 behave identically in every case above.
#   raised buffers      256k buffers do not cause a stall and do not prevent one; the
#                       threshold tracks accumulated bytes, not buffer count.
#   slow consumer       a client reading 512 B every 0.5s from a 1.6 MB/s producer
#                       backpressures identically with buffering on and off. No
#                       differential, and /tmp/proxy_temp stayed empty in both — no
#                       temp-file spooling was observed within a 20s window.
#
# ---------------------------------------------------------------------------
# X-Accel-Buffering
# ---------------------------------------------------------------------------
#
# The API should ALSO send `X-Accel-Buffering: no` on the stream response. It is redundant
# with this file and deliberately so — belt and braces, so the stream survives someone
# adding a second proxy hop later. Note that it makes a proxy_buffering regression
# INVISIBLE, which is why infrastructure/scripts/testing/sse-stub.py does not send it by
# default.
#
# ---------------------------------------------------------------------------
# The test
# ---------------------------------------------------------------------------
#
# infrastructure/scripts/smoke-sse.sh runs four cases against this exact file and fails if
# any of them regresses. Two of them inject a violation — buffering on, and a 5s read
# timeout — and require the stream to break, so a green run means something. It runs in CI
# as the `ingress` job. Test SSE THROUGH nginx or you are not testing SSE.
# ============================================================================

include /etc/nginx/includes/proxy-headers.conf;

proxy_buffering         off;
proxy_cache             off;
proxy_request_buffering off;
gzip                    off;

proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Hand bytes on as they arrive rather than re-chunking them.
chunked_transfer_encoding off;
