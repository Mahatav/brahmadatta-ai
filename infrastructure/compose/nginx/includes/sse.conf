# ============================================================================
# SERVER-SENT EVENTS — THE ONE SETTING THAT MATTERS
# ============================================================================
#
# Include this file INSTEAD OF includes/proxy-common.conf on the event-stream location.
# It pulls in the shared headers itself. Including both gives nginx a duplicate
# proxy_read_timeout and it refuses to start.
#
# WHY proxy_buffering off:
#
# nginx buffers proxied responses by default (proxy_buffering on, a handful of 8k
# buffers). For a normal response that is a win: nginx drains the upstream fast, frees the
# ASGI worker, and dribbles bytes to a slow client at its own pace.
#
# For SSE it is fatal, and fatal *quietly*. The mission event stream is an infinite
# response. With buffering on, nginx holds each `data:` frame until a buffer fills or the
# response ends — and the response never ends. The browser's EventSource stays open, the
# Django view happily writes events, no error appears in any log, and the Command Center
# simply never renders a mission event. The exact failure signature is: SSE works when you
# curl Django on :8000 directly, and dies the moment you go through nginx. That is the
# trap D-013 in .project/decisions.md flags, and it is why every SSE change has to be
# tested THROUGH nginx, never against the ASGI server directly.
# infrastructure/scripts/smoke-sse.sh is that test.
#
# proxy_cache off is the same hazard through a different door: a cached infinite response
# is an infinite cache write.
#
# gzip off matters for the same reason. gzip's own output buffering coalesces small
# frames, so a compressed event stream stalls even with proxy_buffering off.
#
# proxy_read_timeout must outlast an IDLE stream, not a busy one. It measures the gap
# between two reads from the upstream. Between mission phases — a fuzzing campaign, a
# ten-attempt patch generation run — nothing is emitted for minutes, and the default 60s
# would drop the connection mid-mission. One hour covers the longest phase in
# docs/09-company/03-seven-day-plan.md. The API should also emit a `: keepalive` comment
# line every 15s so a genuinely dead TCP path is detected long before this fires.
#
# X-Accel-Buffering: the API should ALSO send `X-Accel-Buffering: no` on the stream
# response. It is redundant with this file and deliberately so — belt and braces, so the
# stream survives someone adding a second proxy hop later.
# ============================================================================

include /etc/nginx/includes/proxy-headers.conf;

proxy_buffering         off;
proxy_cache             off;
proxy_request_buffering off;
gzip                    off;

proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Hand bytes on as they arrive rather than re-chunking them.
chunked_transfer_encoding off;
