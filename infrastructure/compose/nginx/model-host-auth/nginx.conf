# model-host-auth sidecar — nginx main configuration (D-075 / SEC-50).
#
# Deliberately NOT the same nginx.conf as the ingress `nginx` service one directory up:
# this process never terminates TLS, never serves the Command Center or the API, and
# has exactly one job — gate access to Ollama's chat/generate API with a bearer token.
# Runs inside nginxinc/nginx-unprivileged (uid 101), the same pinned image and digest
# as the ingress service, so there is no `user` directive here either — see that
# file's header comment for why one would fail.
#
# This file is mounted read-only, same as the ingress nginx.conf. The one thing that
# is NOT static here is /etc/nginx/conf.d/*.conf, which the image's own
# docker-entrypoint.d/20-envsubst-on-templates.sh step renders from
# templates/model-host-auth.conf.template at container start — see that file for the
# bearer-check logic and templates/README in spirit of nginx/profile/'s comment.

worker_processes  auto;

error_log  /var/log/nginx/error.log  notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  256;
}

http {
    # Unprivileged image: all scratch paths must live under /tmp, same as the ingress
    # nginx.conf.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    default_type  application/octet-stream;

    # The image's own default access_log/error_log paths are symlinked to
    # /dev/stdout and /dev/stderr respectively (docker-library/nginx convention) —
    # not overridden here, so logs land in `docker compose logs model-host-auth`
    # without a separate log volume for what is a small, always-restarted sidecar.
    access_log /var/log/nginx/access.log;

    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
