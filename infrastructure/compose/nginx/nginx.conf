# Brahmadatta AI — nginx main configuration
#
# Runs inside nginxinc/nginx-unprivileged, so there is no `user` directive and every
# writable path is under /tmp. Do not add `user nginx;` — the master process is already
# uid 101 and the directive would fail with a warning on every reload.
#
# This file is the committed source of truth. It is mounted read-only into the container.
# Never hand-edit nginx configuration on a host: change it here, commit, redeploy.

worker_processes  auto;

error_log  /var/log/nginx/error.log  notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Unprivileged image: all scratch paths must live under /tmp.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON access log — docs/06-operations/67-monitoring-and-logging-plan.md
    # asks for structured logs with a trace id. `$http_x_trace_id` is the inbound trace id;
    # `$upstream_http_x_trace_id` is the one Django stamped on the response, which is the
    # one that will match the API log line.
    log_format json_combined escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"scheme":"$scheme",'
        '"host":"$host",'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"trace_id":"$upstream_http_x_trace_id",'
        '"request_trace_id":"$http_x_trace_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    server_tokens   off;
    # SEC-04 (#95): this used to be `0` — no nginx-side ceiling — on the theory that the
    # API's own size check would return a nicer error than a bare 413. That reasoning does
    # not hold: `location /api/` leaves `proxy_request_buffering` at its default of `on`,
    # so nginx reads the ENTIRE request body into the /tmp tmpfs before Django is ever
    # consulted, including for a request `BearerTokenAuth` would reject in microseconds.
    # An unauthenticated multi-gigabyte POST was therefore a memory-exhaustion DoS against
    # host RAM, not against the API. 64m covers every JSON request body this API accepts;
    # the one location that legitimately carries more (the snapshot upload) sets its own
    # override, sized to SNAPSHOT_MAX_BYTES, below in conf.d/*.conf.
    client_max_body_size 64m;

    # Gzip is deliberately NOT enabled globally. gzip on a proxied response re-introduces
    # buffering behaviour on the SSE stream. It is switched on per-location for static
    # assets only — see conf.d/*.conf.
    gzip off;

    # WebSocket / HMR upgrade plumbing. Astro's dev server uses a WebSocket for HMR, and
    # docs/03-technical/17-technology-stack-document.md leaves the door open to a
    # WebSocket for genuinely bidirectional traffic.
    #
    # The empty branch maps to an EMPTY string, not "close". nginx omits a proxy header
    # whose value is empty, so a non-upgrade request gets no Connection header at all and
    # upstream keepalive stays available. Mapping to "close" here would kill keepalive to
    # Django on every ordinary API call.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
