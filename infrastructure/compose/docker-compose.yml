# Brahmadatta AI — DEVELOPMENT stack.
#
#   infrastructure/scripts/dev-up.sh          # preferred; preflights, then up
#   docker compose -f infrastructure/compose/docker-compose.yml --env-file .env up
#
# Relative paths below resolve against THIS FILE's directory (infrastructure/compose/),
# which is why nothing here uses --project-directory. `--env-file` changes interpolation
# only, not path resolution, so it is safe to point at the repository-root .env.
#
# Rules this file follows, from the D1 brief and CLAUDE.md:
#   - every image is pinned by multi-arch index digest; no `latest`, no bare tags
#   - containers run as a non-root user wherever the base image permits (see the
#     per-service notes; postgres and redis are the two that cannot, and why)
#   - C4: nginx is the ONLY container attached to a network with a gateway. Nothing else
#     in this stack can reach anything off the host — not an inference API, not the cloud
#     metadata endpoint, not the internet. This is enforced by the network, not by a
#     validated base URL, because a validated base URL accepts http://169.254.169.254/.
#     Asserted by infrastructure/scripts/egress-test.sh.
#
# #230 (fast-follow on D-099/PR #219): `COMPOSE_PROJECT_NAME` isolates most Compose-managed
# resource names for a linked worktree (dev-up.sh sets it automatically), but three spots in
# this file sit OUTSIDE that project-prefixed naming and do not inherit the isolation for
# free — found colliding live between two concurrent worktrees, 2026-08-21:
#   1. every `container_name:` below is a literal (`brahmadatta-nginx`, ...), which
#      overrides Compose's own project-prefixed auto-naming rather than participating in
#      it — two worktrees both requesting the identical literal name collide even though
#      their Compose PROJECTS are already isolated. Fixed by making every one of them
#      `${COMPOSE_PROJECT_NAME:-brahmadatta}-<service>` — the primary checkout (no
#      worktree, `COMPOSE_PROJECT_NAME` unset) still gets exactly today's names.
#   2. nginx's published host ports (8080/8443) are literal — two worktrees' nginx
#      containers cannot both bind them. Fixed the same way: `${NGINX_HTTP_PORT:-8080}` /
#      `${NGINX_HTTPS_PORT:-8443}` on the `ports:` block below.
#   3. the `api` network's subnet is statically pinned (SEC-14, #98 — so
#      `UVICORN_DEV_FORWARDED_ALLOW_IPS` can name it instead of trusting "*"), not
#      Compose-auto-assigned — two worktrees' `api` networks collide on the same subnet.
#      Fixed by parameterizing that same variable's default rather than inventing a
#      second one, since it was already the single source of truth for this value.
# dev-up.sh derives all three from the SAME worktree hash it already computes for
# `COMPOSE_PROJECT_NAME`, so a given worktree gets stable values across repeated runs and
# only a hash collision (accepted, vanishingly unlikely for a handful of concurrent
# worktrees) would still collide. Bringing this file up directly with `docker compose`
# rather than through dev-up.sh does not get this isolation, same as `COMPOSE_PROJECT_NAME`
# itself already required dev-up.sh to get for free.

name: brahmadatta

x-env: &env-file
  env_file:
    - path: ../../.env
      required: false

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # Ingress. The single published surface: nothing else maps a host port.
  # ---------------------------------------------------------------------------
  nginx:
    # nginxinc/nginx-unprivileged 1.29-alpine. The unprivileged variant is chosen over
    # the stock nginx image specifically so the ingress does not run as root; it listens
    # on 8080/8443 because uid 101 cannot bind a privileged port.
    image: nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-nginx
    <<: *hardening
    read_only: true
    tmpfs:
      # SEC-04 (#95): unsized before this, an unauthenticated caller could fill host RAM
      # through nginx's own request-body buffering (nginx.conf's client_max_body_size
      # comment explains the mechanism). The snapshot route permits 512m, so 640m
      # reserves 25% scratch headroom while retaining a hard memory ceiling (#132).
      - /tmp:size=640m
      - /var/cache/nginx
      - /var/run
      # D-088 (T0): NGINX_ENVSUBST_OUTPUT_DIR default. The image's own envsubst
      # entrypoint step (docker-entrypoint.d/20-envsubst-on-templates.sh, ships in
      # nginxinc/nginx-unprivileged, no extra tooling) renders templates.dev/'s
      # *.template file here at container start, before nginx boots — must be writable
      # even though the rest of the filesystem is read_only. `mode=1777` is required,
      # not decorative: a bare tmpfs mount over this path comes back `root:root 0775`
      # (verified bringing model-host-auth up under the same constraint below), which
      # uid 101 (this image's `nginx` user) cannot write into — the image's own baked-in
      # /etc/nginx/conf.d is `nginx:root 0775` and only writable because uid 101 OWNS it
      # there; a plain tmpfs mount does not preserve that ownership. Same idiom
      # model-host-auth already uses for the identical reason, further down this file.
      - /etc/nginx/conf.d:mode=1777
    cap_drop: ["ALL"]
    environment:
      # D-088 (T0): the real bearer credential nginx injects into the three
      # control-api-proxied locations (SSE, snapshot upload, /api/) in
      # templates.dev/brahmadatta.conf.template — see that file's header comment. Exists
      # only in this container's process environment and the tmpfs-rendered config file
      # above; the browser never holds or attaches it. Blank-by-default here follows the
      # SAME "unset = that credential cannot authenticate at all, fails closed"
      # convention CONTROL_API_REVIEWER_TOKEN/CONTROL_API_ADMIN_TOKEN already use (see
      # control-api's environment block below) — NOT a hard startup failure, because an
      # unset value here means every proxied request 401s at control-api exactly as it
      # did before this change, not a new failure mode.
      #
      # Deliberately NOT via the `*env-file` (`x-env`) anchor the way control-api and
      # command-center use it below — cybersecurity review of this task (T0) flagged
      # that D-088's literal text ("add the nginx service to the existing x-env anchor")
      # would give nginx EVERY variable in `.env` (44 at last count: `DJANGO_SECRET_KEY`,
      # `POSTGRES_PASSWORD`, `REDIS_PASSWORD`, every other role token, ...) as real
      # container-process environment, even though nginx's own config only ever reads
      # this one. `docker compose config nginx` demonstrated this concretely before the
      # fix: an `env_file:` entry loads the WHOLE file into the container's process
      # environment regardless of which keys any given process actually consumes.
      # nginx is also the ONLY container with a route off the host (C4) — the single
      # highest-exposure process in this stack — so it is exactly the wrong place to
      # carry 43 credentials it has no use for. This mirrors a concern this same file
      # already treats as worth actively engineering around: see
      # `MODEL_HOST_BEARER_TOKEN`'s own comment in `.env.example` on why it is declared
      # in a way that keeps it OUT of `fuzz-worker`'s ambient environment even though
      # that process never reads it either. Compose resolves `${VAR}` interpolation
      # below from `--env-file`/the process environment at compose-parse time
      # regardless of whether a service also declares `env_file:` — so this one
      # explicit line reaches nginx's container environment with the token it actually
      # needs, and nothing else does.
      CONTROL_API_OPERATOR_TOKEN: ${CONTROL_API_OPERATOR_TOKEN:-}
      # Restricts the entrypoint's envsubst call to this ONE variable name — see the
      # long comment at the top of templates.dev/brahmadatta.conf.template for why an
      # unrestricted envsubst pass would corrupt nginx's own `$host`/`$request_uri`/etc.
      # variable syntax in that file.
      NGINX_ENVSUBST_FILTER: "^CONTROL_API_OPERATOR_TOKEN$"
    ports:
      # #230: host ports parameterized, container ports are not — nginx's own conf
      # (nginx.conf / templates.dev/) still `listen`s on the literal 8080/8443 inside the
      # container; only which HOST port maps to them varies per worktree. See this file's
      # header comment for the full reasoning.
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:8080"   # plaintext, redirects to 8443
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:8443"   # TLS, self-signed in dev
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      # THE PROFILE SWITCH. docker-compose.finale.yml mounts profile/admin-deny.conf at
      # this same path, which turns /admin into a 404 with no config edit.
      # It lives in profile/ and not includes/ because Docker cannot create a new
      # mountpoint inside an already read-only bind mount.
      - ./nginx/profile/admin-allow.conf:/etc/nginx/profile/admin.conf:ro
      # D-088 (T0): templates, not a pre-rendered conf.d/ bind mount any more — see
      # templates.dev/brahmadatta.conf.template's header comment. Mounted at
      # /etc/nginx/templates (NGINX_ENVSUBST_TEMPLATE_DIR's default), NOT at
      # /etc/nginx/conf.d — that path is the tmpfs entry above, which the entrypoint
      # renders into, not a bind mount (Docker cannot create a new mountpoint inside an
      # already read-only bind mount, same constraint as the profile/ split above).
      - ./nginx/templates.dev:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    networks:
      # The ONLY service on `external`, and therefore the only container in the stack with
      # a route off the host. See the comment on the networks: block (C4).
      - external
      - api      # nginx <-> control-api, and nothing else is on it
      - edge     # nginx <-> the Astro dev server, and nothing else is on it
    depends_on:
      control-api:
        condition: service_started
      command-center:
        condition: service_started
    healthcheck:
      # Plaintext /healthz, so the probe does not have to trust a self-signed cert.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Control API — Django + django-ninja over ASGI (uvicorn).
  # No published port on purpose: the only way in is through nginx, so the proxy is
  # never accidentally bypassed while testing SSE. See includes/sse.conf.
  # ---------------------------------------------------------------------------
  control-api:
    build:
      context: ../../apps/control-api
      dockerfile: ../../infrastructure/compose/images/control-api.Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-control-api
    <<: [*env-file, *hardening]
    # SEC-04 (#95) / SEC-38 (#132): mirrors nginx and the finale profile. Django's
    # temporary upload handler also needs the full 512m body plus bounded headroom.
    tmpfs:
      - /tmp:size=640m
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      # Container-local overrides of the values in apps/control-api/.env.example, which
      # are written for a bare-metal run. Inside compose the hostnames are service names
      # and the browser origin is the nginx TLS listener, not the Astro dev port.
      DATABASE_URL: ${DATABASE_URL:-postgresql://brahmadatta:brahmadatta-dev@db:5432/brahmadatta}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,control-api,nginx}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost:8443,http://localhost:8080}
      # SEC-14 (#98): the `api` network's pinned subnet (see the `networks:` block below),
      # not `*`. Before this, the dev target trusted X-Forwarded-Proto / X-Forwarded-For
      # from ANY client that could reach the container — which is only nginx today, but
      # "only nginx today" was configuration, not enforcement.
      #
      # The CONTAINER env var is UVICORN_FORWARDED_ALLOW_IPS — that name is fixed, it is
      # what the Dockerfile's dev-target CMD reads. Its VALUE here is sourced from a
      # DIFFERENTLY-named compose interpolation variable, UVICORN_DEV_FORWARDED_ALLOW_IPS,
      # and that split is deliberate, not decorative: docker-compose.yml (this file) and
      # docker-compose.finale.yml both read the SAME repository-root .env
      # (docker-compose.finale.yml's own header, point 3), and .env.example already
      # defines UVICORN_FORWARDED_ALLOW_IPS=172.31.0.0/24 for the finale edge subnet under
      # "Finale only". Reusing that name here would have meant `${UVICORN_FORWARDED_ALLOW_IPS
      # :-172.28.90.0/24}` silently resolved to the FINALE value the moment a developer
      # copied .env.example to .env — Compose's `:-default` only fires when the variable is
      # completely unset, and .env sets it. Caught in this session by actually bringing the
      # dev stack up and reading the container's real environment, not by inspection.
      UVICORN_FORWARDED_ALLOW_IPS: ${UVICORN_DEV_FORWARDED_ALLOW_IPS:-172.28.90.0/24}
      PYTHONPATH: /app
      # D-100: config.settings.base.MODEL_GATEWAY_ROOT's default only resolves
      # correctly bare-metal (REPO_ROOT/services/model-gateway) — inside this
      # container REPO_ROOT collapses to the container filesystem root, which does not
      # hold services/model-gateway. Pointed explicitly at the bind mount below.
      MODEL_GATEWAY_ROOT: /app/services/model-gateway
    volumes:
      - ../../apps/control-api:/app
      # Keep the host's macOS/arm .venv out of the container; /opt/venv is the real one.
      - /app/.venv
      # `config.settings.base.SNAPSHOT_SOURCE_ROOT` defaults to `/demo/repositories`.
      # Nothing mounted that path here either — `source="git"` snapshot ingestion
      # against a local demo target (e.g. `pktcfg`) had never actually worked
      # containerized. Read-only: control-api only ever reads from here to build a
      # deterministic tar (`authorization/archive.py`). Found running the #50 live
      # rehearsal against the finale profile, 2026-08-17; mirrored here for parity.
      - ../../demo/repositories:/demo/repositories:ro
      # `missions/apps.py`'s `ready()` (#168 T1) imports `workers.baseline.dispatch`
      # unconditionally on every Django process start, and that module imports
      # `packages.sandbox` — so control-api now fails `ModuleNotFoundError: No module
      # named 'workers'` on boot without these. `workers/`, `packages/`, `adapters/` are
      # siblings of `apps/`, exactly like `demo/` above, and the `dev` target copies
      # nothing in (source arrives entirely by bind mount) — so unlike the `runtime`
      # target's `additional_contexts` fix in docker-compose.finale.yml, this is a plain
      # bind mount here, landing at the same /app/<name> paths so dev and finale present
      # an identical importable layout. Not :ro: unlike demo/repositories (read-only
      # fixture data), these are live source directories other roles actively edit, and
      # uvicorn's --reload-dir /app already picks up nested-mount changes the same way it
      # does for /app itself. See control-api.Dockerfile's matching comment.
      - ../../workers:/app/workers
      - ../../packages:/app/packages
      - ../../adapters:/app/adapters
      # `services/model-gateway/` — D-100 (.project/decisions.md). Same shape and
      # reason as the three bind mounts directly above: `orchestrator/
      # patch_generate_executor.py::_model_gateway_root()` needs this on `sys.path`
      # for `JobKind.PATCH_GENERATE`'s live-model path to import `gateway.*` at all,
      # and it was never reachable inside this container before this fix. Not :ro:
      # live source other roles actively edit, same as workers/packages/adapters.
      - ../../services/model-gateway:/app/services/model-gateway
    networks:
      # `api`, NOT `edge`. control-api shares a network with nginx and with nothing else.
      # See the networks: block — this is the fix for the Critical in the security review.
      - api
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Astro dev server.
  #
  # Runs from the pinned node image with the source bind-mounted rather than from
  # images/command-center.Dockerfile, because rebuilding an image on every dependency
  # change is a dev server nobody uses. The Dockerfile is for the finale build.
  #
  # UNVERIFIED as of D1: apps/command-center/ does not exist yet. dev-up.sh refuses to
  # start rather than letting Docker create the directory as root.
  #
  # C4 detail: dependency installation is split into its own short-lived service below,
  # because `npm ci` needs the registry and the long-running dev server must not have a
  # route off the host. The installer holds no repository content and exits before the
  # dev server starts.
  # ---------------------------------------------------------------------------
  command-center-deps:
    image: node@sha256:dbcedd8aeab47fbc0f4dd4bffa55b7c3c729a707875968d467aaaea42d6225af
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-command-center-deps
    <<: *hardening
    user: "1000:1000"
    working_dir: /app
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: ["npm", "ci", "--no-audit", "--no-fund"]
    volumes:
      - ../../apps/command-center:/app
      - command-center-node-modules:/app/node_modules
    networks:
      # Egress to the npm registry, and nothing else on this network.
      - external
    restart: "no"

  command-center:
    image: node@sha256:dbcedd8aeab47fbc0f4dd4bffa55b7c3c729a707875968d467aaaea42d6225af
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-command-center
    <<: [*env-file, *hardening]
    user: "1000:1000"   # the `node` user that ships in the image
    working_dir: /app
    environment:
      # Astro/Vite bind to loopback by default, which is unreachable from nginx.
      HOST: "0.0.0.0"
      PORT: "4321"
      # Public API origin as the BROWSER sees it — through nginx, not the service name.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://localhost:8443}
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "4321"]
    volumes:
      - ../../apps/command-center:/app
      - command-center-node-modules:/app/node_modules
      # The Astro source imports the design system's single token source directly.
      - ../../packages/ui-components:/packages/ui-components:ro
    networks:
      # No `external`. If a dependency is missing, the fix is to re-run
      # command-center-deps, not to give the dev server a route out.
      - edge
    depends_on:
      command-center-deps:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local model host — OPT-IN (`--profile model`).
  #
  # D5/D6 use Ollama CodeLlama through the model gateway. This host stays on the
  # internal backend network, so model pulls happen explicitly on a prepared volume
  # before the judged run. The hard memory ceiling is the #36 guard: an OOM kills
  # the model host, not Postgres or the operator workstation.
  # ---------------------------------------------------------------------------
  model-host:
    profiles: ["model"]
    image: ollama/ollama@sha256:f478761c18fea69b1624e095bce0f8aab06825d09ccabcd0f88828db0df185ce
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-model-host
    <<: *hardening
    mem_limit: ${MODEL_HOST_MEM_LIMIT:-8g}
    environment:
      # D-075 / SEC-50: loopback-only, INSIDE this container's own network namespace.
      # Cybersecurity proved that `internal: true` on `backend` (below) does not stop a
      # NEW container — created by anything holding Docker daemon access, which
      # `fuzz-worker` is irreducibly granted under D-073 — from joining `backend`
      # directly and reaching a `0.0.0.0`-bound service at L3/L4 regardless of network
      # membership at compose-authoring time. Binding loopback-only here means 11434 is
      # unreachable from any OTHER container on `backend`, however it got there — not
      # because of which network this container sits on, but because loopback inside a
      # network namespace is never visible on that namespace's external interface, full
      # stop. `model-host-auth` below shares this exact namespace
      # (`network_mode: "service:model-host"`) and is the only thing that still reaches
      # it; everything else on `backend` now hits a listener that demands a bearer
      # token it structurally never holds. See D-075 in .project/decisions.md.
      #
      # Port 11435, not 11434: nginx (below) needs to bind `11434` itself, wildcard, so
      # every OTHER container on `backend` keeps reaching `model-host:11434` unchanged.
      # A wildcard `0.0.0.0:11434` bind and an exact `127.0.0.1:11434` bind in the SAME
      # network namespace collide at the kernel level (`EADDRINUSE` — the wildcard bind
      # is refused because it would shadow the already-bound specific address on that
      # exact port) regardless of bind order; verified by actually bringing this pair
      # up. Different ports is the fix, not a workaround: nothing outside this
      # container/namespace ever dials Ollama directly any more, so its own internal
      # port number is free to be anything and is not part of any external contract.
      OLLAMA_HOST: 127.0.0.1:11435
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend
    healthcheck:
      # Unaffected by the loopback-only bind: `ollama list` execs inside this same
      # container/namespace, which always reaches its own loopback regardless of what
      # the external interface exposes.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  # ---------------------------------------------------------------------------
  # model-host-auth — D-075 / SEC-50. Bearer-token gate in front of Ollama.
  #
  # `network_mode: "service:model-host"`, NOT its own `backend` membership: this
  # container joins model-host's network namespace outright — same IP, same loopback,
  # same interfaces — rather than becoming a second, independent member of `backend`.
  # That is what makes it the ONLY thing that can still reach Ollama's now
  # loopback-only 11434: it runs *inside* the one namespace where that loopback is
  # visible, instead of routing to it over `backend` the way every other container on
  # that network — including one a Docker-daemon-holding adversary joins directly, per
  # SEC-50's own PoC — would have to.
  #
  # It takes over port 11434 on the shared namespace's `backend`-visible interface —
  # the port Ollama itself no longer answers there — so every other container on
  # `backend` still reaches `model-host:11434` exactly as before; only the answer at
  # that address changes. It now demands `Authorization: Bearer
  # <MODEL_HOST_BEARER_TOKEN>` or returns 401. See
  # infrastructure/compose/nginx/model-host-auth/ for the conf template — the same
  # envsubst-templated, mounted-conf idiom D-019 already established for
  # nginx/profile/admin-allow.conf vs admin-deny.conf.
  #
  # Must never be given `fuzz-worker`'s environment, and `fuzz-worker` must never be
  # given this token: `fuzz-worker` is a bare-metal host process (D-073,
  # infrastructure/scripts/run-fuzz-worker.sh), not a compose service, has no
  # model-gateway client of any kind, and has no reason to reach `model-host` at all —
  # independently enforced by tests/architecture/test_fuzz_worker_isolation.py on the
  # branch that introduces it. `MODEL_HOST_BEARER_TOKEN` is deliberately declared only
  # in THIS file's .env (compose-only), never in apps/control-api/.env.example, because
  # `run-fuzz-worker.sh` sources apps/control-api/.env wholesale
  # (`set -a; source .env; set +a`) — a var declared there would land in fuzz-worker's
  # process environment even though its code never reads it.
  # ---------------------------------------------------------------------------
  model-host-auth:
    profiles: ["model"]
    image: nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-model-host-auth
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      # NGINX_ENVSUBST_OUTPUT_DIR default. The image's own envsubst entrypoint step
      # (docker-entrypoint.d/20-envsubst-on-templates.sh, ships in
      # nginxinc/nginx-unprivileged, no extra tooling) writes the rendered
      # model-host-auth.conf here at container start, before nginx boots — must be
      # writable even though the rest of the filesystem is read_only. `mode=1777`
      # is required, not decorative: a bare tmpfs mount over this path comes back
      # `root:root 0775` (verified by actually bringing this service up), which uid
      # 101 (this image's `nginx` user, see nginx.conf's header comment) cannot write
      # into — the image's own baked-in `/etc/nginx/conf.d` is `nginx:root 0775` and
      # only writable because uid 101 OWNS it there; a plain tmpfs mount does not
      # preserve that ownership.
      - /etc/nginx/conf.d:mode=1777
    cap_drop: ["ALL"]
    environment:
      # Dev default: blank. This is the SAME "unset = that credential cannot
      # authenticate, fails closed" convention CONTROL_API_REVIEWER_TOKEN/
      # CONTROL_API_ADMIN_TOKEN already use above — NOT the same convention
      # REDIS_PASSWORD's blank dev default uses, which disables redis's auth mechanism
      # outright (no --requirepass at all). This nginx conf has no such bypass: a
      # blank token here means the header check can never match anything a real client
      # sends, so `--profile model` stays unusable in dev until a real value is
      # generated and set — deliberately, because SEC-50's gate has to hold the moment
      # `model-host` is reachable in ANY environment, not just the finale deployment.
      MODEL_HOST_BEARER_TOKEN: ${MODEL_HOST_BEARER_TOKEN:-}
      # D-123 (.project/decisions.md): the single source of truth this nginx conf's
      # proxy_read_timeout/proxy_send_timeout now derive from (see the template's own
      # header comment), shared with gateway.ollama.OllamaCodeLlamaBackend's client
      # timeout via gateway.settings.GatewaySettings.model_host_timeout_seconds --
      # not two independently hardcoded 300s literals that only matched by
      # coincidence. Defaults to 300 (unchanged behavior) until an operator
      # deliberately raises it.
      MODEL_HOST_TIMEOUT_SECONDS: ${MODEL_HOST_TIMEOUT_SECONDS:-300}
    volumes:
      - ./nginx/model-host-auth/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/model-host-auth/templates:/etc/nginx/templates:ro
    network_mode: "service:model-host"
    depends_on:
      model-host:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL.
  #
  # ROOTLESS NOTE: this image cannot be run with a `user:` override against a fresh named
  # volume. The entrypoint starts as root, chowns PGDATA, then drops to uid 70 (postgres)
  # via su-exec for the server itself — so the long-running process is unprivileged, but
  # the first moments are not. Forcing `user: 70:70` makes initdb fail on a
  # root-owned empty volume. Capabilities are trimmed to the five the chown/drop needs.
  # ---------------------------------------------------------------------------
  db:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94  # 17.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-db
    <<: *hardening
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brahmadatta}
      POSTGRES_USER: ${POSTGRES_USER:-brahmadatta}
      # Dev-only default. The real value comes from .env; see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brahmadatta-dev}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      # Published on LOOPBACK ONLY, dev profile only. D-073: `fuzz-worker`
      # (infrastructure/scripts/run-fuzz-worker.sh) is a bare-metal host process, not
      # a compose service — it has no route onto the `backend` network (`internal:
      # true`) at all, so it needs Postgres reachable at `127.0.0.1` the same way
      # nginx already is. `apps/control-api/.env.example`'s own `DATABASE_URL`
      # default (`localhost:5432`) already assumed this was reachable; it previously
      # was not — this closes that pre-existing gap rather than opening a new one.
      # Not published in docker-compose.finale.yml: that file states "no port is
      # published except through nginx" as an explicit invariant, and changing it for
      # the finale host is an open decision for CTO/devops + cybersecurity, not made
      # here — see the D-073 follow-up entry in .project/decisions.md.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brahmadatta} -d ${POSTGRES_DB:-brahmadatta}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — the queue broker.
  #
  # ROOTLESS NOTE: same shape as postgres. The entrypoint chowns /data as root and then
  # execs redis-server as the `redis` user.
  #
  # No password in dev. It is only reachable on the `backend` network, which is
  # `internal: true` and publishes no host port. docker-compose.finale.yml sets one.
  # ---------------------------------------------------------------------------
  redis:
    image: redis@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103  # 8.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-redis
    <<: *hardening
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Queue worker — OPT-IN (`--profile worker`).
  #
  # Gated behind a profile because the queue framework is not chosen yet: as of D1
  # apps/control-api/requirements.txt has no rq and no celery, so the default command
  # below would crash-loop and bury every other service's logs. It becomes a default
  # service in the same commit that adds the dependency. See D-018 in
  # .project/decisions.md.
  #
  # D-073 — this container claims every JobKind EXCEPT FUZZ/MINIMIZE, BY DESIGN, not
  # by an oversight in `manage.py run_worker`'s `--kinds` flag. It has no `docker` CLI
  # and D-036 forbids ever mounting the host's Docker socket into it, so it structurally
  # cannot run `packages.sandbox.container.ContainerJail` — the mechanism every FUZZ/
  # MINIMIZE job needs. FUZZ/MINIMIZE are claimed instead by `fuzz-worker`, a SEPARATE
  # bare-metal process on the host (infrastructure/scripts/run-fuzz-worker.sh), started
  # as `python manage.py run_worker --kinds FUZZ,MINIMIZE` — the only process anywhere
  # in this system ever given container-runtime access, and deliberately given no
  # model-gateway client and no route to model-host. Do NOT "fix" this by mounting
  # /var/run/docker.sock here or by adding FUZZ back to this service's claimed kinds —
  # see .project/decisions.md D-036 and D-073 before changing anything in this block.
  # ---------------------------------------------------------------------------
  worker:
    profiles: ["worker"]
    build:
      context: ../../apps/control-api
      dockerfile: ../../infrastructure/compose/images/control-api.Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-worker
    <<: [*env-file, *hardening]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://brahmadatta:brahmadatta-dev@db:5432/brahmadatta}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      # #189: threaded through so it is visible here even though THIS service cannot
      # currently act on it — see the comment block above `worker:` for why.
      SANDBOX_FUZZ_IMAGE: ${SANDBOX_FUZZ_IMAGE:-}
      # D-100: this is the process that actually runs JobKind.PATCH_GENERATE — see
      # control-api's identical MODEL_GATEWAY_ROOT comment above.
      MODEL_GATEWAY_ROOT: /app/services/model-gateway
    # D-062/D-122: `rqworker`/`django_rq` was never a real dependency of this project
    # (queue.py's own docstring: "one table, no broker") — this shell-level default only
    # ever fires if CONTROL_API_WORKER_CMD is unset in the environment/`.env` entirely,
    # but it crash-looped every such container on `Unknown command: 'rqworker'` until
    # fixed here, matching the real management command (`run_worker.py`). See
    # .env.example's matching fix for the primary (`.env`-driven) path.
    command: ${CONTROL_API_WORKER_CMD:-python manage.py run_worker}
    volumes:
      - ../../apps/control-api:/app
      - /app/.venv
      # Same fix as control-api's identical mounts above — worker is the process that
      # actually runs the stage executors, so it needs these at least as much.
      - ../../workers:/app/workers
      - ../../packages:/app/packages
      - ../../adapters:/app/adapters
      # Same fix as control-api's identical mount above — D-100.
      - ../../services/model-gateway:/app/services/model-gateway
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Orchestrator — `manage.py run_orchestrator`, the tick loop (`orchestrator/queue.py::
  # tick()`) that owns `Mission.state` and is THE ONLY process that ever calls
  # `orchestrator.transitions.transition()` outside `authorization.service`'s own callers.
  # `run_worker` (above) claims and executes individual `Job` rows but deliberately never
  # writes `Mission.state` — see that service's own comment and `orchestrator/executors.py`'s
  # module docstring for why that boundary is load-bearing. Without this process running,
  # NOTHING advances a mission past `VALIDATING`, ever, no matter how many `worker`/
  # `fuzz-worker` processes are up — found live wiring the model gateway into this stack
  # (D-121) and started by hand (`docker compose exec -d control-api python manage.py
  # run_orchestrator`) for that session's own verification only; that is exactly the
  # not-durable gap this service closes. Devops-scoped per D-121's own final-approval line
  # and the D-062 staffing plan ("add the missing `orchestrator` service to both compose
  # profiles").
  #
  # NOT profile-gated, unlike `worker`: there is no split-fleet reason to make this
  # optional (D-073 is about `FUZZ`/`MINIMIZE` needing container-runtime access `worker`
  # structurally cannot have; nothing about `run_orchestrator` has an equivalent second
  # mode), and #57's three timed finale rehearsals need it running for the mission's
  # entire duration with no operator action — gating it behind a flag would just move the
  # hand-intervention problem from "start the process" to "remember the flag".
  #
  # Does NOT need `/var/run/docker.sock`, `packages.sandbox`'s container backend, or a
  # model-gateway client, so D-036's socket-mount prohibition and D-073's bare-metal
  # `fuzz-worker` split do not apply here the way they do to FUZZ/MINIMIZE — this is not
  # copied from `fuzz-worker`'s exemption reflexively, it is a different process with a
  # different dependency footprint: `run_orchestrator.py`'s own module docstring states it
  # "[n]ever runs a subprocess, never touches a repository, never holds an inference
  # client", and `orchestrator/queue.py::tick()` (everything this process calls) only ever
  # reads/writes Postgres — no Redis, no filesystem snapshot, no `gateway.*` import (that
  # import is lazy and confined to `run_worker`'s own claim loop, per `orchestrator/
  # patch_generate_executor.py`'s module docstring). A plain containerized service is
  # therefore sufficient, same as `control-api`/`worker` themselves.
  #
  # `restart: unless-stopped` is safe with SEC-43's singleton advisory lock (`orchestrator/
  # singleton_lock.py`): the lock is held on this process's own dedicated Postgres session
  # and is released automatically the instant that session closes (crash, kill, or a clean
  # `docker compose restart`) — so a Compose-driven restart never leaves a stale lock
  # behind for the replacement process to collide with. Verified live, not just argued from
  # the docstring: see .project/decisions.md D-122.
  orchestrator:
    build:
      context: ../../apps/control-api
      dockerfile: ../../infrastructure/compose/images/control-api.Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-brahmadatta}-orchestrator
    <<: [*env-file, *hardening]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://brahmadatta:brahmadatta-dev@db:5432/brahmadatta}
      PYTHONPATH: /app
      # No REDIS_URL: unlike control-api/worker, this process never touches Redis at all
      # (queue.py's own docstring: "One table, no broker") — carrying it here would just
      # be a var nothing reads. No MODEL_GATEWAY_ROOT / model-host wiring either, for the
      # same reason: see this service's header comment.
    command: python manage.py run_orchestrator
    volumes:
      - ../../apps/control-api:/app
      - /app/.venv
      # Same fix as control-api's/worker's identical mounts above (#168 T1 regression):
      # `missions/apps.py::ready()` imports `workers.baseline.dispatch` and `workers.
      # fuzzing.dispatch` unconditionally on EVERY Django process start, including this
      # one, and those modules import `packages.sandbox` — omitting these three mounts
      # is `ModuleNotFoundError: No module named 'workers'` on boot, not a degraded mode.
      # No `demo/repositories` mount and no `services/model-gateway` mount: this process
      # never ingests a snapshot and never imports `gateway.*` (see header comment) — the
      # bind mounts control-api/worker need for THOSE two things are not needed here.
      - ../../workers:/app/workers
      - ../../packages:/app/packages
      - ../../adapters:/app/adapters
    networks:
      # `backend` only — same as `worker`. This process never talks to nginx or the
      # browser, only to Postgres.
      - backend
    depends_on:
      db:
        condition: service_healthy
      # No `redis` dependency: see the environment block's comment above.
    restart: unless-stopped

networks:
  # C4: nginx is THE ONLY container attached to a network with a gateway.
  #
  # The product's hardest invariant is that repository content never reaches an external
  # inference API. Before this change that was enforced over *configuration* — a validated
  # base URL checked at startup — which `http://169.254.169.254/` passes, and which is the
  # cloud metadata endpoint on a rented VM. Configuration is not a boundary. The network is.
  #
  # So: every container that can hold a repository snapshot or assemble a prompt —
  # control-api, worker, and later the orchestrator and the model host — is on
  # `internal: true` networks only, and has no route off the host at any layer.
  # `internal: true` blocks egress, not ingress, so nginx still reaches them fine.
  #
  # infrastructure/scripts/egress-test.sh is the assertion, and it fails the moment
  # someone adds a second service to this network to make something work.
  external:
    driver: bridge

  # nginx <-> control-api. No gateway, and no third member.
  #
  # This is a separate network from `edge` rather than one shared "ingress" network,
  # because the two have different blast radii. If someone ever needs to give the Astro dev
  # server a route out to make something work, that must not silently hand egress to the
  # process holding repository snapshots and operator credentials. Separate networks make
  # that a deliberate act instead of a side effect.
  #
  # SEC-14 (#98): the subnet is pinned rather than left to Docker's auto-allocation so it
  # can be trusted by uvicorn's --forwarded-allow-ips in the control-api dev target — see
  # UVICORN_FORWARDED_ALLOW_IPS below. Only nginx and control-api are ever members, and the
  # network is `internal: true`, so trusting "anything with an address on this /24" is
  # trusting "nginx, or nothing" rather than "anything that can reach the container".
  api:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        # #230: parameterized on the SAME variable that already carries this exact value
        # for UVICORN_FORWARDED_ALLOW_IPS below — not a new variable, since the two were
        # already required to agree (see that variable's own comment) and inventing a
        # second name for the same value would just be a new way for them to drift.
        # dev-up.sh overrides this for a linked worktree so two worktrees' `api` networks
        # do not collide; the primary checkout keeps today's 172.28.90.0/24.
        - subnet: ${UVICORN_DEV_FORWARDED_ALLOW_IPS:-172.28.90.0/24}

  # nginx <-> the Astro dev server. No gateway.
  edge:
    driver: bridge
    internal: true

  # Application <-> data. No gateway.
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  nginx-logs:
  command-center-node-modules:
  ollama-models:
